<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>History Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            background-image: radial-gradient(circle, #0c0c2c, #000000);
            overscroll-behavior-y: contain;
        }
        canvas {
            background-color: #000;
            display: block;
            margin: 0 auto;
            border: 3px solid #00FFFF;
            box-shadow: 0 0 15px #00FFFF, 0 0 25px #0000FF, inset 0 0 10px #0000FF;
        }
        #game-wrapper {
            position: relative;
            width: fit-content;
            margin: 0 auto;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .modal {
            background-color: rgba(10, 20, 50, 0.85);
            border: 2px solid #00FFFF;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px #00FFFF;
            border-radius: 1rem;
            max-height: 90vh; /* Added for scroll */
            overflow-y: auto; /* Added for scroll */
        }
        .modal-button {
            transition: all 0.2s ease;
            text-shadow: 0 0 5px #fff;
        }
        .modal-button:hover, .modal-button.selected {
            background-color: #FFFF00;
            color: #000;
            transform: scale(1.05);
            box-shadow: 0 0 15px #FFFF00;
        }
        #message-text {
            white-space: pre-wrap;
        }
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background-color: rgba(0, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #joystick-knob {
            width: 60px;
            height: 60px;
            background-color: rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            position: absolute;
        }
         #mute-btn {
            cursor: pointer;
            width: 32px;
            height: 32px;
        }
        /* New Styles for Unit Selection Grid */
        .unit-select-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columns */
            gap: 1rem;
        }
        @media (min-width: 640px) { /* sm breakpoint */
            .unit-select-grid {
                grid-template-columns: repeat(4, 1fr); /* 4 columns for larger screens */
            }
        }
    </style>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen">

    <!-- NEW Unit Selection Modal (Shows first) -->
    <div id="unit-selection-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="modal w-full max-w-xl p-8 text-center">
            <h1 class="text-3xl md:text-4xl text-yellow-300 mb-8 tracking-wider" style="text-shadow: 0 0 10px #FFFF00;">Pac-Man History Challenge</h1>
            <h2 class="text-2xl mb-4 text-cyan-300">Select Your Unit:</h2>
            <div class="unit-select-grid">
                <button id="selectUnit1" class="modal-button bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-lg">Unit 1</button>
                <button id="selectUnit2" class="modal-button bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-lg">Unit 2</button>
                <button id="selectUnit3" class="modal-button bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-lg">Unit 3</button>
                <button id="selectUnit4" class="modal-button bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-lg">Unit 4</button>
                <button id="selectUnit5" class="modal-button bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-lg">Unit 5</button>
                <button id="selectUnit6" class="modal-button bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-lg">Unit 6</button>
                <button id="selectUnit7" class="modal-button bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-lg">Unit 7</button>
                <button id="selectUnit8" class="modal-button bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-lg">Unit 8</button>
            </div>
        </div>
    </div>

    <!-- Start Modal (Now hidden) -->
    <div id="start-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="modal w-full max-w-xl p-8 text-center">
            <h1 class="text-3xl md:text-4xl text-yellow-300 mb-8 tracking-wider" style="text-shadow: 0 0 10px #FFFF00;">Pac-Man History Challenge</h1>
            <h2 class="text-2xl mb-4 text-cyan-300">Select Mode:</h2>
            <div class="flex justify-center gap-4 mb-8">
                <button id="normal-mode-btn" class="modal-button selected bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-xl">Normal</button>
                <button id="advanced-mode-btn" class="modal-button bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-xl">Advanced</button>
            </div>
            <p class="mb-2 text-sm text-gray-300">Normal: Unlimited time for questions.</p>
            <p class="mb-8 text-sm text-gray-300">Advanced: 15 seconds to answer!</p>
            <button id="start-game-btn" class="modal-button bg-green-500 hover:bg-green-400 text-white font-bold py-4 px-8 rounded-lg text-2xl animate-pulse">Start Game</button>
        </div>
    </div>


    <div id="game-container" class="hidden w-full max-w-4xl mx-auto p-4">
        <h1 class="text-3xl md:text-4xl text-yellow-300 mb-4 tracking-wider" style="text-shadow: 0 0 10px #FFFF00;">Pac-Man History Challenge</h1>
        <div class="flex justify-between items-center w-full max-w-lg text-lg mb-4 text-cyan-300">
            <p>Score: <span id="score">0</span></p>
            <p>Level: <span id="level">1</span></p>
            <div id="mute-btn" title="Toggle Sound">
                <svg id="sound-on-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
                    <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.66 1.905H6.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06zM18.584 5.106a.75.75 0 011.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 11-1.06-1.06 8.25 8.25 0 000-11.668.75.75 0 010-1.06z" />
                    <path d="M15.932 7.757a.75.75 0 011.061 0 6 6 0 010 8.486.75.75 0 01-1.06-1.061 4.5 4.5 0 000-6.364.75.75 0 010-1.06z" />
                </svg>
                <svg id="sound-off-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 hidden">
                    <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.66 1.905H6.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06zM18.28 15.28a.75.75 0 001.06-1.06l-6-6a.75.75 0 00-1.06 1.06l6 6zM19.34 16.34a.75.75 0 10-1.06-1.06l-1.061-1.061a.75.75 0 10-1.06 1.06l1.06 1.06zM19.07 9.53a.75.75 0 010 1.06l-2.121 2.122a.75.75 0 01-1.06-1.06l2.12-2.121a.75.75 0 011.061 0z" />
                </svg>
            </div>
        </div>
        <div id="game-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="joystick-container" class="hidden md-hidden">
                <div id="joystick-knob"></div>
            </div>
        </div>
    </div>

    <!-- Question Modal -->
    <div id="question-modal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50">
        <div class="modal w-full max-w-2xl p-8 text-center">
            <h2 class="text-2xl mb-2 text-yellow-300">A GHOST CAUGHT YOU!</h2>
            <p class="mb-4 text-lg text-cyan-300">Answer correctly to survive...</p>
            <p id="question-text" class="text-xl mb-6"></p>
            <div id="options-container" class="grid grid-cols-1 gap-4">
                <!-- Options will be injected here by JS -->
            </div>
            <div id="timer-container" class="hidden mt-6">
                <p class="text-2xl text-red-500">Time Left: <span id="timer-countdown">15</span></p>
            </div>
        </div>
    </div>

    <!-- Message Modal (Level Clear, Game Over, Win) -->
    <div id="message-modal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50">
        <div class="modal w-full max-w-md p-8 text-center">
            <h2 id="message-title" class="text-3xl mb-6 text-yellow-300"></h2>
            <p id="message-text" class="text-xl mb-8"></p>
            <button id="message-button" class="modal-button bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-xl">Continue</button>
        </div>
    </div>


    <script>
        // DOM Elements
        const startModal = document.getElementById('start-modal');
        const normalModeBtn = document.getElementById('normal-mode-btn');
        const advancedModeBtn = document.getElementById('advanced-mode-btn');
        const startGameBtn = document.getElementById('start-game-btn');
        const gameContainer = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const questionModal = document.getElementById('question-modal');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const timerContainer = document.getElementById('timer-container');
        const timerCountdownEl = document.getElementById('timer-countdown');
        const messageModal = document.getElementById('message-modal');
        const messageTitleEl = document.getElementById('message-title');
        const messageTextEl = document.getElementById('message-text');
        const messageButton = document.getElementById('message-button');
        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        const muteBtn = document.getElementById('mute-btn');
        const soundOnIcon = document.getElementById('sound-on-icon');
        const soundOffIcon = document.getElementById('sound-off-icon');

        // NEW: Unit Selection DOM Elements
        const unitSelectionModal = document.getElementById('unit-selection-modal');
        const unitSelectBtns = {
            unit1: document.getElementById('selectUnit1'),
            unit2: document.getElementById('selectUnit2'),
            unit3: document.getElementById('selectUnit3'),
            unit4: document.getElementById('selectUnit4'),
            unit5: document.getElementById('selectUnit5'),
            unit6: document.getElementById('selectUnit6'),
            unit7: document.getElementById('selectUnit7'),
            unit8: document.getElementById('selectUnit8'),
        };


        // Game constants
        const TILE_SIZE = 20;
        let mapWidth, mapHeight;

        // Game state
        let pacman;
        let ghosts = [];
        let score = 0;
        let level = 1;
        let pellets = [];
        let powerPellets = [];
        let gameActive = true;
        let caughtGhost = null;
        let animationFrameId;
        let isInitializing = false;
        let gameMode = 'normal';
        let questionTimer = null;
        let countdownInterval = null;
        let availableQuestions = [];
        let askedQuestions = [];
        let currentQuestion = null;
        let correctAnswersCount = 0;
        let currentMap;
        let particles = [];
        let stars = [];
        let shakeDuration = 0;
        let shakeMagnitude = 0;
        let sounds = {};
        let isMuted = false;
        let audioInitialized = false;

        // NEW: Selected Unit Bank
        let selectedUnitBank = [];


        // Level-based settings
        const levelSettings = {
            1: { ghostSpeed: 1.5, powerPelletDuration: 6000 },
            2: { ghostSpeed: 1.7, powerPelletDuration: 5000 },
            3: { ghostSpeed: 1.9, powerPelletDuration: 4000 },
            4: { ghostSpeed: 2.1, powerPelletDuration: 3000 },
            5: { ghostSpeed: 2.3, powerPelletDuration: 2000 },
        };
        
        // --- NEW: All Unit Question Banks ---
        const unitQuestionBanks = {
            unit1: [
                { q: "What was one of the most devastating impacts of the Columbian Exchange on the \"New World\" (The Americas)?", o: ["The introduction of crops like potatoes and tomatoes.", "The introduction of European diseases to which natives had no immunity.", "The exchange of precious metals, which enriched native populations.", "The introduction of livestock like cattle, which destroyed all native crops."], a: 1 },
                { q: "According to the study guide, how did the Columbian Exchange economically impact the \"Old World\" (Europe)?", o: ["It led to widespread disease that crippled European economies.", "It introduced new crops like wheat and cattle, which were previously unknown.", "It provided an influx of goods and precious metals from the Americas, enriching European nations.", "It drained European treasuries due to the high cost of exploration."], a: 2 },
                { q: "Which of the following describes a correct exchange of goods during the Columbian Exchange as per the study guide?", o: ["Europe sent potatoes and tomatoes to the Americas.", "The Americas sent wheat and cattle to Europe.", "Europe sent diseases to the Americas, and the Americas sent precious metals to Europe.", "The Americas sent firearms and rum to Africa."], a: 2 },
                { q: "What economic theory is described as fueling European colonization by promoting the exchange of manufactured goods for slaves, who were then used to produce raw materials for Europe?", o: ["Capitalism", "The Columbian Exchange", "Mercantilism", "The Social Contract"], a: 2 },
                { q: "The study guide describes mercantilism in the context of the Triangular Trade. What was transported from Africa to the Americas in this trade network?", o: ["Guns, ironware, and rum", "Sugar, tobacco, and cotton", "African slaves", "Precious metals and wheat"], a: 2 },
                { q: "What was transported from the Americas to Europe as part of the Triangular Trade?", o: ["Manufactured goods", "African slaves", "Guns and ironware", "Raw materials like sugar, tobacco, and cotton"], a: 3 },
                { q: "What was the primary motivation for groups like the Puritans, Quakers, and Anglicans to colonize North America?", o: ["To find gold and precious metals.", "To establish a new system of mercantilism.", "To escape religious persecution and worship as they wished.", "To gain military experience by fighting the French."], a: 2 },
                { q: "Which group sought to create a \"city upon a hill,\" a religiously pure community?", o: ["The Anglicans", "The Puritans", "The Quakers", "The British Parliament"], a: 1 },
                { q: "Pennsylvania was founded by the Quakers, led by William Penn, as a haven for what?", o: ["Religious tolerance and acceptance.", "Puritan worship only.", "Plantation-based agriculture.", "Shipbuilding and fishing."], a: 0 },
                { q: "How was the economy of the New England colonies shaped by its geography?", o: ["The warm climate and rich soil made it ideal for cash crops like tobacco.", "The fertile soil led to it being called the \"breadbasket\" of the colonies.", "The rocky soil and short growing season led to a focus on trade, shipbuilding, and fishing.", "Its proximity to Africa made it the center of the slave trade."], a: 2 },
                { q: "The Middle Colonies were known as the \"breadbasket\" of the colonies for what reason?", o: ["They had a warm climate and rich soil for cash crops.", "They focused on fishing and shipbuilding.", "They had rocky soil and a short growing season.", "They had fertile soil and a moderate climate suitable for grain and livestock."], a: 3 },
                { q: "What was the primary economic focus of the Southern colonies, based on their geography?", o: ["Trade, shipbuilding, and fishing.", "Producing grain and livestock.", "Plantation-based agriculture, growing crops like tobacco, rice, and indigo.", "Manufacturing firearms and textiles."], a: 2 },
                { q: "According to John Locke's ideas of Natural Rights, where does a legitimate government get its authority?", o: ["From the monarch or king.", "From its military power.", "From the consent of the people.", "From its control of trade and resources."], a: 2 },
                { q: "What are the three natural rights John Locke believed individuals are born with?", o: ["Life, liberty, and property.", "Life, liberty, and the pursuit of happiness.", "Food, clothing, and ammunition.", "Religious freedom, freedom of speech, and the right to vote."], a: 0 },
                { q: "What was a major outcome of the French and Indian War for the British?", o: ["They lost all their territories in the Americas.", "They formed a permanent, peaceful alliance with all native tribes.", "They acquired Canada and all French territories east of the Mississippi River.", "The war left them debt-free and economically prosperous."], a: 2 },
                { q: "What was a significant impact of the French and Indian War on the *colonists*?", o: ["Britain immediately granted them more autonomy and representation.", "Britain imposed new taxes and stricter control to help pay off war debt.", "They were forced to give up all their land west of the Mississippi.", "They were immediately granted full British citizenship."], a: 1 },
                { q: "What British policy, enacted after the French and Indian War, limited westward expansion and fueled colonists' discontent?", o: ["The Treaty of Paris", "The Declaration of Independence", "The Proclamation of 1763", "The Triangular Trade Act"], a: 2 },

                { q: "What right did the Declaration of Independence assert that people have in relation to a destructive government?", o: ["The right to patiently endure it.", "The right to appeal to the British King.", "The right to alter or abolish it.", "The right to pay taxes to it without representation."], a: 2 },

                { q: "What was a significant financial challenge for the Continental Army?", o: ["The Continental Congress struggled to raise funds to support the army.", "Soldiers were overpaid, leading to inflation.", "Foreign aid from France was too expensive to accept.", "British blockades prevented the army from spending its money."], a: 0 },

                { q: "Who was mentioned as a key leader providing essential military expertise to the Continental Army?", o: ["John Locke", "William Penn", "George Washington", "Thomas Jefferson"], a: 2 },
                { q: "What advantage did the colonists have over the British forces during the Revolutionary War?", o: ["A superior navy.", "A well-funded treasury.", "Knowledge of the local terrain (home-field advantage).", "A professionally trained and experienced army."], a: 2 }

            unit2: [

                { q: "What issue did Andrew Jackson face in the 1830s that nearly led to South Carolina's secession?", o: ["The Indian Removal Act", "The purchase of the Louisiana Territory", "The nullification crisis over federal tariffs", "The election of 1800"], a: 2 },
                { q: "How did the Indian Removal Act of 1830 impact the relationship between the U.S. government and Native American communities?", o: ["It improved the relationship by guaranteeing ancestral lands.", "It had no significant impact.", "It strained the relationship by forcing the relocation of many tribes.", "It led to the Monroe Doctrine."], a: 2 }

        class Particle {
            constructor(x, y, color, speed, life) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 3 + 1;
                this.life = life || Math.random() * 50 + 30;
                this.initialLife = this.life;
                this.velX = (Math.random() - 0.5) * speed;
                this.velY = (Math.random() - 0.5) * speed;
            }

            update() {
                this.life--;
                this.x += this.velX;
                this.y += this.velY;
                this.size *= 0.98;
            }

            draw() {
                ctx.globalAlpha = this.life / this.initialLife;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function createParticleExplosion(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, Math.random() * 3 + 1));
            }
        }

        function triggerShake(duration, magnitude) {
            shakeDuration = duration;
            shakeMagnitude = magnitude;
        }

        class Character {
            constructor(x, y, speed, radius) {
                this.x = x;
                this.y = y;
                this.speed = speed;
                this.radius = radius;
                this.velX = 0;
                this.velY = 0;
                this.nextVelX = 0;
                this.nextVelY = 0;
            }

            getGridPos() { return { col: Math.floor(this.x / TILE_SIZE), row: Math.floor(this.y / TILE_SIZE) }; }
            isAtCenterOfTile() { const xCenter = (this.getGridPos().col * TILE_SIZE) + TILE_SIZE / 2; const yCenter = (this.getGridPos().row * TILE_SIZE) + TILE_SIZE / 2; return Math.abs(this.x - xCenter) < this.speed / 2 && Math.abs(this.y - yCenter) < this.speed / 2; }

            update() {
                if (this.isAtCenterOfTile()) {
                    const { col, row } = this.getGridPos();
                    if (this.nextVelX !== 0 || this.nextVelY !== 0) {
                        const nextCol = col + this.nextVelX;
                        const nextRow = row + this.nextVelY;
                        if (nextRow >= 0 && nextRow < mapHeight && currentMap[nextRow] && currentMap[nextRow][nextCol] !== 0) { this.velX = this.nextVelX; this.velY = this.nextVelY; }
                    }
                    const currentCol = col + this.velX; const currentRow = row + this.velY;
                    if (currentRow < 0 || currentRow >= mapHeight || currentMap[currentRow][currentCol] === 0) { this.x = col * TILE_SIZE + TILE_SIZE / 2; this.y = row * TILE_SIZE + TILE_SIZE / 2; this.velX = 0; this.velY = 0; }
                }
                this.x += this.velX * this.speed; this.y += this.velY * this.speed;
                if (this.x < 0) this.x = mapWidth * TILE_SIZE - TILE_SIZE / 2;
                if (this.x > mapWidth * TILE_SIZE) this.x = TILE_SIZE / 2;
            }
        }
        
        class Pacman extends Character {
            constructor(x, y, speed) { super(x, y, speed, TILE_SIZE / 2 - 2); this.angle = 0.2; this.mouthOpen = true; }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                let rotation = 0;
                if (this.velX === 1) rotation = 0; else if (this.velX === -1) rotation = Math.PI; else if (this.velY === 1) rotation = Math.PI / 2; else if (this.velY === -1) rotation = -Math.PI / 2;
                ctx.rotate(rotation);
                if (this.velX !== 0 || this.velY !== 0) { this.angle += (this.mouthOpen ? -1 : 1) * 0.05; if (this.angle < 0 || this.angle > 0.2) { this.mouthOpen = !this.mouthOpen; } }
                
                ctx.shadowColor = 'yellow';
                ctx.shadowBlur = 15;
                ctx.fillStyle = 'yellow'; 
                ctx.beginPath(); 
                ctx.arc(0, 0, this.radius, this.angle, Math.PI * 2 - this.angle); 
                ctx.lineTo(0, 0); 
                ctx.fill(); 
                ctx.restore();
            }
        }

        class Ghost extends Character {
            constructor(x, y, speed, color, spawnX, spawnY) { super(x, y, speed, TILE_SIZE / 2 - 2); this.color = color; this.spawnX = spawnX; this.spawnY = spawnY; this.state = 'chasing'; this.frightenTimer = 0; this.respawnTimer = 0; this.spawnTimer = 0; }
            draw() {
                const isFrightened = this.state === 'frightened';
                const pulse = isFrightened ? Math.abs(Math.sin(Date.now() / 150)) * 0.5 + 0.5 : 1.0;

                ctx.save();
                ctx.globalAlpha = (this.state === 'eaten' || this.state === 'respawning') ? 0.3 : pulse;
                ctx.shadowBlur = 15;
                ctx.shadowColor = isFrightened ? '#00FFFF' : this.color;
                ctx.fillStyle = isFrightened ? '#0000FF' : this.color;
                
                if (this.state !== 'eaten' && this.state !== 'respawning') {
                    ctx.beginPath(); 
                    ctx.arc(this.x, this.y, this.radius, Math.PI, 0); 
                    ctx.lineTo(this.x + this.radius, this.y + this.radius); 
                    ctx.lineTo(this.x + this.radius - this.radius/3, this.y + this.radius*0.8); 
                    ctx.lineTo(this.x + this.radius - (this.radius/3)*2, this.y + this.radius); 
                    ctx.lineTo(this.x, this.y + this.radius*0.8); 
                    ctx.lineTo(this.x - this.radius + (this.radius/3)*2, this.y + this.radius); 
                    ctx.lineTo(this.x - this.radius + this.radius/3, this.y + this.radius*0.8); 
                    ctx.lineTo(this.x - this.radius, this.y + this.radius); 
                    ctx.closePath(); 
                    ctx.fill();
                }
                
                ctx.shadowBlur = 0; // No shadow for eyes
                const eyeOffsetX = this.radius * 0.3; const eyeOffsetY = -this.radius * 0.2;
                ctx.fillStyle = 'white'; 
                ctx.beginPath(); 
                ctx.arc(this.x - eyeOffsetX, this.y + eyeOffsetY, this.radius * 0.25, 0, Math.PI * 2); 
                ctx.arc(this.x + eyeOffsetX, this.y + eyeOffsetY, this.radius * 0.25, 0, Math.PI * 2); 
                ctx.fill();
                
                ctx.fillStyle = isFrightened ? 'red' : 'black'; 
                let pupilOffsetX = 0, pupilOffsetY = 0;
                if (this.velX === 1) pupilOffsetX = 1; if (this.velX === -1) pupilOffsetX = -1; if (this.velY === 1) pupilOffsetY = 1; if (this.velY === -1) pupilOffsetY = -1;
                ctx.beginPath(); 
                ctx.arc(this.x - eyeOffsetX + pupilOffsetX, this.y + eyeOffsetY + pupilOffsetY, this.radius * 0.1, 0, Math.PI * 2); 
                ctx.arc(this.x + eyeOffsetX + pupilOffsetX, this.y + eyeOffsetY + pupilOffsetY, this.radius * 0.1, 0, Math.PI * 2); 
                ctx.fill();
                ctx.restore();
            }
            update() {
                if (this.spawnTimer > 0) {
                    this.spawnTimer -= 1000 / 60;
                    return;
                }
                if (this.state === 'respawning') { this.respawnTimer -= 1000 / 60; if (this.respawnTimer <= 0) { this.state = 'chasing'; } return; }
                if (this.state === 'eaten') { if (Math.abs(this.x - this.spawnX) < this.speed && Math.abs(this.y - this.spawnY) < this.speed) { this.state = 'respawning'; this.respawnTimer = 1000; } else { this.aiMove(this.spawnX, this.spawnY); } }
                else { if (this.state === 'frightened') { this.frightenTimer -= 1000 / 60; if (this.frightenTimer <= 0) { this.state = 'chasing'; } } this.aiMove(pacman.x, pacman.y, this.state === 'frightened'); }
                super.update();
            }
            aiMove(targetX, targetY, isFrightened = false) {
                   if (this.isAtCenterOfTile()) {
                        const { col, row } = this.getGridPos(); const possibleMoves = [];
                        if (currentMap[row - 1]?.[col] !== 0) possibleMoves.push({ x: 0, y: -1 }); if (currentMap[row + 1]?.[col] !== 0) possibleMoves.push({ x: 0, y: 1 }); if (currentMap[row]?.[col - 1] !== 0) possibleMoves.push({ x: -1, y: 0 }); if (currentMap[row]?.[col + 1] !== 0) possibleMoves.push({ x: 1, y: 0 });
                        const filteredMoves = possibleMoves.filter(move => move.x !== -this.velX || move.y !== -this.velY); let bestMove; const movesToConsider = filteredMoves.length > 0 ? filteredMoves : possibleMoves;
                        if (movesToConsider.length > 0) {
                            let bestDistance = isFrightened ? -Infinity : Infinity;
                            movesToConsider.forEach(move => { const newX = this.x + move.x * TILE_SIZE; const newY = this.y + move.y * TILE_SIZE; const distance = Math.hypot(newX - targetX, newY - targetY); if (isFrightened) { if(distance > bestDistance) { bestDistance = distance; bestMove = move; } } else { if (distance < bestDistance) { bestDistance = distance; bestMove = move; } } });
                            if(Math.random() > 0.8 && movesToConsider.length > 1) { bestMove = movesToConsider[Math.floor(Math.random() * movesToConsider.length)]; }
                        }
                        if(bestMove) { this.nextVelX = bestMove.x; this.nextVelY = bestMove.y; }
                   }
            }
            frighten() { if(this.state !== 'eaten' && this.state !== 'respawning') { this.state = 'frightened'; this.frightenTimer = (levelSettings[level] || levelSettings[5]).powerPelletDuration; } }
        }

        function initAudio() {
            if (audioInitialized) return;
            
            sounds.munch = new Tone.MembraneSynth({
                pitchDecay: 0.008,
                octaves: 2,
                envelope: { attack: 0.001, decay: 0.2, sustain: 0 },
            }).toDestination();

            sounds.powerUp = new Tone.Synth({
                oscillator: { type: 'pwm', modulationFrequency: 0.2 },
                envelope: { attack: 0.02, decay: 0.4, sustain: 0.2, release: 0.1 },
            }).toDestination();
            
            sounds.eatGhost = new Tone.Synth({
                 oscillator: { type: 'triangle8' },
                 envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.2 },
            }).toDestination();

            sounds.deathSynth = new Tone.Synth({
                oscillator: { type: 'sawtooth' },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.1 }
            }).toDestination();

            sounds.playDeathSound = () => {
                const deathNotes = ['F#4', 'F4', 'E4', 'D#4', 'D4', 'C#4'];
                let delay = 0;
                deathNotes.forEach(note => {
                    sounds.deathSynth.triggerAttackRelease(note, '16n', `+${delay}`);
                    delay += 0.08;
                });
            };

            sounds.start = new Tone.Synth({
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.3, release: 0.5 },
            }).toDestination();

            sounds.levelClear = new Tone.Synth({
                envelope: { attack: 0.1, decay: 0.3, sustain: 0.4, release: 0.5 },
            }).toDestination();

            audioInitialized = true;
        }

        function playSound(sound, ...args) {
            if (!audioInitialized || isMuted) return;

            if (sound === 'death') {
                if (sounds.playDeathSound) sounds.playDeathSound();
                return;
            }

            if (!sounds[sound]) return;
            
            const [note, duration] = args;
            const synth = sounds[sound];
            
            if (synth instanceof Tone.NoiseSynth) {
                synth.triggerAttackRelease(note);
            } else if(synth) {
                synth.triggerAttackRelease(note, duration);
            }
        }

        // MODIFIED: Now populates from selectedUnitBank
        function initializeQuestions() { 
            if (selectedUnitBank.length > 0) {
                availableQuestions = [...selectedUnitBank]; 
            } else {
                // Fallback: This should ideally not be hit if unit selection is forced.
                console.error("No unit bank selected! Defaulting to Unit 1.");
                availableQuestions = [...unitQuestionBanks.unit1];
            }
            askedQuestions = []; 
        }
        
        function init() {
            if (isInitializing) return; isInitializing = true; if(animationFrameId) cancelAnimationFrame(animationFrameId);
            
            currentMap = maps[(level - 1) % maps.length];
            mapWidth = currentMap[0].length; mapHeight = currentMap.length; canvas.width = mapWidth * TILE_SIZE; canvas.height = mapHeight * TILE_SIZE;
            levelEl.textContent = level; scoreEl.textContent = score;
            
            pellets = []; powerPellets = []; ghosts = []; particles = [];
            let ghostSpawns = [];
            let pacmanSpawn = { x: canvas.width / 2, y: canvas.height / 2 };

            for (let row = 0; row < mapHeight; row++) {
                for (let col = 0; col < mapWidth; col++) {
                    const x = col * TILE_SIZE + TILE_SIZE / 2; const y = row * TILE_SIZE + TILE_SIZE / 2;
                    switch(currentMap[row][col]) {
                        case 1: pellets.push({ x, y }); break;
                        case 3: powerPellets.push({ x, y, active: true }); break;
                        case 4: ghostSpawns.push({x, y}); break;
                        case 5: pacmanSpawn = { x, y }; currentMap[row][col] = 2; break;
                    }
                }
            }
            
            pacman = new Pacman(pacmanSpawn.x, pacmanSpawn.y, 2);

            const ghostColors = ['#FF0000', '#FFB8FF', '#00FFFF', '#FFB852'];
            if (ghostSpawns.length > 0) { 
                for (let i = 0; i < 4; i++) { 
                    const spawn = ghostSpawns[i % ghostSpawns.length]; 
                    const { ghostSpeed } = levelSettings[level] || levelSettings[5]; 
                    const newGhost = new Ghost(spawn.x, spawn.y, ghostSpeed, ghostColors[i], spawn.x, spawn.y);
                    newGhost.spawnTimer = 2000;
                    ghosts.push(newGhost);
                } 
            }

            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.2,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }

            gameActive = true; isInitializing = false; gameLoop();
        }
        
        // MODIFIED: This function now sends the user back to the unit selection modal
        function returnToStart() {
            gameContainer.classList.add('hidden');
            startModal.classList.add('hidden'); // Ensure start modal is hidden
            unitSelectionModal.classList.remove('hidden'); // Show unit selection
            level = 1; 
            score = 0; 
            correctAnswersCount = 0; 
        }
        
        function gameLoop() { 
            if (!gameActive) return; 
            update(); 
            draw(); 
            animationFrameId = requestAnimationFrame(gameLoop); 
        }

        function update() { 
            pacman.update(); 
            ghosts.forEach(ghost => ghost.update()); 
            particles.forEach((p, index) => {
                p.update();
                if (p.life <= 0) particles.splice(index, 1);
            });
            checkCollisions(); 
        }

        function draw() { 
            ctx.save();
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (shakeDuration > 0) {
                shakeDuration--;
                const dx = (Math.random() - 0.5) * shakeMagnitude;
                const dy = (Math.random() - 0.5) * shakeMagnitude;
                ctx.translate(dx, dy);
            }

            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            });

            drawMap(); 
            drawPellets(); 
            particles.forEach(p => p.draw());
            ghosts.forEach(ghost => ghost.draw()); 
            pacman.draw(); 

            ctx.restore();
        }
        
        function drawMap() { 
            const wallColor = "#0000FF";
            ctx.fillStyle = wallColor;
            ctx.shadowColor = '#00FFFF';
            ctx.shadowBlur = 15;
            for (let row = 0; row < mapHeight; row++) { 
                for (let col = 0; col < mapWidth; col++) { 
                    if (currentMap[row][col] === 0) { 
                        ctx.fillRect(col * TILE_SIZE, row * TILE_SIZE, TILE_SIZE, TILE_SIZE); 
                    } 
                } 
            } 
            ctx.shadowBlur = 0;
        }

        function drawPellets() {
            pellets.forEach(p => { 
                ctx.beginPath(); 
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); 
                ctx.fillStyle = '#FFFFFF';
                ctx.shadowColor = '#FFFFFF';
                ctx.shadowBlur = 10;
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            powerPellets.forEach(pp => { 
                if (pp.active) { 
                    const scale = Math.abs(Math.sin(Date.now() / 200)) * 0.5 + 0.8;
                    ctx.beginPath(); 
                    ctx.arc(pp.x, pp.y, 6 * scale, 0, Math.PI * 2); 
                    ctx.fillStyle = '#FFFF00';
                    ctx.shadowColor = '#FFFF00';
                    ctx.shadowBlur = 20;
                    ctx.fill();
                } 
            });
            ctx.shadowBlur = 0;
        }

        function checkCollisions() {
            for (let i = pellets.length - 1; i >= 0; i--) { 
                const p = pellets[i]; 
                if (Math.hypot(pacman.x - p.x, pacman.y - p.y) < pacman.radius) { 
                    playSound('munch', 'C2', '16n');
                    createParticleExplosion(p.x, p.y, '#FFFFFF', 5);
                    pellets.splice(i, 1); 
                    score += 10; 
                    scoreEl.textContent = score; 
                } 
            }
            for (let i = powerPellets.length - 1; i >= 0; i--) { 
                const pp = powerPellets[i]; 
                if (pp.active && Math.hypot(pacman.x - pp.x, pacman.y - pp.y) < pacman.radius + 4) { 
                    playSound('powerUp', 'G3', '4n');
                    pp.active = false; 
                    score += 50; 
                    scoreEl.textContent = score; 
                    ghosts.forEach(ghost => ghost.frighten()); 
                    triggerShake(20, 8);
                } 
            }
            ghosts.forEach(ghost => { 
                if (ghost.spawnTimer > 0) return;
                if (Math.hypot(pacman.x - ghost.x, pacman.y - ghost.y) < pacman.radius + ghost.radius) { 
                    if (ghost.state === 'frightened') { 
                        playSound('eatGhost', 'C5', '8n');
                        createParticleExplosion(ghost.x, ghost.y, '#00FFFF', 30);
                        ghost.state = 'eaten'; 
                        score += 200; 
                        scoreEl.textContent = score; 
                    } else if (ghost.state === 'chasing') {
                        playSound('death');
                        triggerShake(15, 5);
                        score = Math.max(0, score - 200); 
                        scoreEl.textContent = score;
                        gameActive = false; 
                        caughtGhost = ghost; 
                        showQuestion(); 
                    } 
                } 
            });
            if (pellets.length === 0) { gameActive = false; if(level < 5) showLevelClear(); else showWinScreen(); }
        }

        function showQuestion() {
            if (availableQuestions.length === 0) { 
                if (askedQuestions.length > 0) {
                    availableQuestions = [...askedQuestions]; 
                    askedQuestions = [];
                } else {
                    // This means the selectedUnitBank was empty
                    console.error("No questions in bank!");
                    showMessage("Error!", "No questions found for this unit. Returning to start.", returnToStart);
                    return;
                }
            }
            
            const questionIndex = Math.floor(Math.random() * availableQuestions.length); 
            currentQuestion = availableQuestions[questionIndex];
            
            questionTextEl.textContent = currentQuestion.q; 
            optionsContainer.innerHTML = '';
            
            currentQuestion.o.forEach((option, index) => { 
                const button = document.createElement('button'); 
                button.textContent = `${String.fromCharCode(65 + index)}. ${option}`; 
                button.classList.add('modal-button', 'w-full', 'p-4', 'border-2', 'border-cyan-500', 'rounded-lg', 'text-left', 'text-lg'); 
                button.onclick = () => handleAnswer(index, questionIndex); 
                optionsContainer.appendChild(button); 
            });
            
            if (gameMode === 'advanced') { 
                timerContainer.classList.remove('hidden'); 
                let timeLeft = 15; 
                timerCountdownEl.textContent = timeLeft; 
                countdownInterval = setInterval(() => { timeLeft--; timerCountdownEl.textContent = timeLeft; }, 1000); 
                questionTimer = setTimeout(() => { handleAnswer(-1, questionIndex); }, 15000); 
            } else { 
                timerContainer.classList.add('hidden'); 
            }
            
            questionModal.classList.remove('hidden');
        }

        function handleAnswer(selectedIndex, questionIndex) {
            clearTimeout(questionTimer); clearInterval(countdownInterval); questionModal.classList.add('hidden');
            const isCorrect = selectedIndex === currentQuestion.a;
            
            if (isCorrect) { 
                correctAnswersCount++; 
                askedQuestions.push(availableQuestions.splice(questionIndex, 1)[0]); 
                showMessage("CORRECT!", "The ghost is returning to its base.", () => { 
                    if(caughtGhost) caughtGhost.state = 'eaten'; 
                    gameActive = true; 
                    gameLoop(); 
                }); 
            } else { 
                const reason = selectedIndex === -1 ? "You ran out of time!" : "Wrong answer!"; 
                // MODIFIED: Send back to unit selection
                showMessage("GAME OVER", `Final Score: ${score}\nQuestions Correct: ${correctAnswersCount}\n\n${reason}`, returnToStart); 
            }
        }
        
        function showMessage(title, text, buttonAction) { 
            messageTitleEl.textContent = title; 
            messageTextEl.textContent = text; 
            messageButton.onclick = () => { 
                messageModal.classList.add('hidden'); 
                buttonAction(); 
            }; 
            messageModal.classList.remove('hidden'); 
        }
        
        function showLevelClear() { 
            playSound('levelClear', 'C4', '2n');
            showMessage(`LEVEL ${level} CLEARED!`, `Your score: ${score}`, () => { level++; init(); }); 
        }
        
        function showWinScreen() { 
            playSound('levelClear', 'G5', '1n');
            // MODIFIED: Send back to unit selection
            showMessage("YOU WIN!", `Congratulations!\n\nFinal Score: ${score}\nQuestions Correct: ${correctAnswersCount}`, returnToStart); 
        }
        
        function setupJoystick() {
            const joystickRect = joystickContainer.getBoundingClientRect();
            const knobRect = joystickKnob.getBoundingClientRect();
            const joystickCenterX = joystickRect.left + joystickRect.width / 2;
            const joystickCenterY = joystickRect.top + joystickRect.height / 2;
            const maxKnobDisplacement = joystickRect.width / 2 - knobRect.width / 2;

            let isDragging = false;

            function handleTouchStart(e) {
                e.preventDefault();
                if (e.target === joystickContainer || e.target === joystickKnob) {
                    isDragging = true;
                }
            }

            function handleTouchMove(e) {
                e.preventDefault();
                if (!isDragging) return;

                const touch = e.changedTouches[0];
                const deltaX = touch.clientX - joystickCenterX;
                const deltaY = touch.clientY - joystickCenterY;
                const angle = Math.atan2(deltaY, deltaX);
                const distance = Math.min(Math.hypot(deltaX, deltaY), maxKnobDisplacement);
                
                const knobX = Math.cos(angle) * distance;
                const knobY = Math.sin(angle) * distance;
                joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

                const angleDeg = angle * 180 / Math.PI;
                if (angleDeg > -45 && angleDeg <= 45) { // Right
                    pacman.nextVelX = 1; pacman.nextVelY = 0;
                } else if (angleDeg > 45 && angleDeg <= 135) { // Down
                    pacman.nextVelX = 0; pacman.nextVelY = 1;
                } else if (angleDeg > 135 || angleDeg <= -135) { // Left
                    pacman.nextVelX = -1; pacman.nextVelY = 0;
                } else { // Up
                    pacman.nextVelX = 0; pacman.nextVelY = -1;
                }
            }

            function handleTouchEnd(e) {
                e.preventDefault();
                isDragging = false;
                joystickKnob.style.transform = `translate(0px, 0px)`;
            }

            joystickContainer.addEventListener('touchstart', handleTouchStart, { passive: false });
            window.addEventListener('touchmove', handleTouchMove, { passive: false });
            window.addEventListener('touchend', handleTouchEnd, { passive: false });
        }


        // Event Listeners
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) { e.preventDefault(); }
            if(!pacman) return;
            switch (e.key) {
                case 'ArrowUp': pacman.nextVelX = 0; pacman.nextVelY = -1; break;
                case 'ArrowDown': pacman.nextVelX = 0; pacman.nextVelY = 1; break;
                case 'ArrowLeft': pacman.nextVelX = -1; pacman.nextVelY = 0; break;
                case 'ArrowRight': pacman.nextVelX = 1; pacman.nextVelY = 0; break;
            }
        });

        normalModeBtn.addEventListener('click', () => { gameMode = 'normal'; normalModeBtn.classList.add('selected'); advancedModeBtn.classList.remove('selected'); });
        advancedModeBtn.addEventListener('click', () => { gameMode = 'advanced'; advancedModeBtn.classList.add('selected'); normalModeBtn.classList.remove('selected'); });

        startGameBtn.addEventListener('click', () => {
            startModal.classList.add('hidden');
            gameContainer.classList.remove('hidden');
            if (window.innerWidth < 768) {
                joystickContainer.classList.remove('hidden');
            }
            if (!audioInitialized) {
                Tone.start();
                initAudio();
            }
            playSound('start', 'C3', '4n');
            initializeQuestions(); // Questions are now initialized based on selectedUnitBank
            init();
            setupJoystick();
        });

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            soundOnIcon.classList.toggle('hidden', isMuted);
            soundOffIcon.classList.toggle('hidden', !isMuted);
        });

        // --- NEW: Unit Selection Listeners ---
        function selectUnit(unitKey) {
            selectedUnitBank = unitQuestionBanks[unitKey]; // Set the bank for the whole game
            unitSelectionModal.classList.add('hidden');
            startModal.classList.remove('hidden'); // Show the original start modal
        }

        unitSelectBtns.unit1.addEventListener('click', () => selectUnit('unit1'));
        unitSelectBtns.unit2.addEventListener('click', () => selectUnit('unit2'));
        unitSelectBtns.unit3.addEventListener('click', () => selectUnit('unit3'));
        unitSelectBtns.unit4.addEventListener('click', () => selectUnit('unit4'));
        unitSelectBtns.unit5.addEventListener('click', () => selectUnit('unit5'));
        unitSelectBtns.unit6.addEventListener('click', () => selectUnit('unit6'));
        unitSelectBtns.unit7.addEventListener('click', () => selectUnit('unit7'));
        unitSelectBtns.unit8.addEventListener('click', () => selectUnit('unit8'));


    </script>
