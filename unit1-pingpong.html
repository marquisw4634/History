<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Test Pong - Full Canvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #000;
            color: #ffffff;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        canvas {
            background-color: #000000;
            display: block;
            /* cursor: none; <-- This was removed to make the cursor visible */
            /* Glow effect for a bloom/CRT monitor look */
            filter: drop-shadow(0 0 5px #00ffff) drop-shadow(0 0 10px #ff00ff);
        }
        /* Screen Shake Animation */
        @keyframes shake {
            0% { transform: translate(1px, 1px); } 10% { transform: translate(-1px, -2px); }
            20% { transform: translate(-3px, 0px); } 30% { transform: translate(3px, 2px); }
            40% { transform: translate(1px, -1px); } 50% { transform: translate(-1px, 2px); }
            60% { transform: translate(-3px, 1px); } 70% { transform: translate(3px, 1px); }
            80% { transform: translate(-1px, -1px); } 90% { transform: translate(1px, 2px); }
            100% { transform: translate(0, 0); }
        }
        .screen-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>

        // --- GRAPHICS & UTILITY FUNCTIONS ---
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 1.5, alpha: Math.random() * 0.5 + 0.5, dx: (Math.random() - 0.5) * 0.1 });
            }
        }

        function drawStars() {
            stars.forEach(star => {
                star.x += star.dx;
                if (star.x < 0) star.x = canvas.width;
                if (star.x > canvas.width) star.x = 0;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            });
        }

        function createParticles(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push({ x, y, radius: Math.random() * 2 + 1, color, dx: (Math.random() - 0.5) * (Math.random() * 6), dy: (Math.random() - 0.5) * (Math.random() * 6), alpha: 1, decay: Math.random() * 0.05 + 0.01 });
            }
        }
        
        function triggerScreenShake() {
            canvas.classList.add('screen-shake');
            setTimeout(() => canvas.classList.remove('screen-shake'), 500);
        }

        function wrapText(text, x, y, maxWidth, lineHeight, font = null) {
            if(font) ctx.font = font;
            const words = text.split(' ');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
            return y; // Return the final y position
        }

        // --- CORE GAME FUNCTIONS (REWRITTEN) ---
        function resizeCanvas() {
            const container = document.body;
            const aspectRatio = 16 / 9;
            let newWidth = container.clientWidth;
            let newHeight = container.clientHeight;

            if (newWidth / newHeight > aspectRatio) {
                newWidth = newHeight * aspectRatio;
            } else {
                newHeight = newWidth / aspectRatio;
            }
            canvas.width = newWidth * 0.95;
            canvas.height = newHeight * 0.95;
            // Re-init or rescale game elements if needed
            if(gameActive || currentScreen !== 'rules') init();
        }

        function init() {
            score = { player: 0, cpu: 0 };
            totalScore = 0; volleyCount = 0;
            updateScoreDisplay();
            ball = { x: canvas.width / 2, y: canvas.height / 2, radius: BALL_RADIUS, speed: BASE_SPEED, dx: BASE_SPEED, dy: BASE_SPEED, color: BALL_COLOR, alpha: 1, pulseTime: 0 };
            player = { x: 10, y: canvas.height / 2 - PADDLE_HEIGHT / 2, width: PADDLE_WIDTH, height: PADDLE_HEIGHT, defaultHeight: PADDLE_HEIGHT, targetY: canvas.height / 2, speed: 0.5, speedMultiplier: 1, color: PLAYER_COLOR };
            cpu = { x: canvas.width - 10 - PADDLE_WIDTH, y: canvas.height / 2 - PADDLE_HEIGHT / 2, width: PADDLE_WIDTH, height: PADDLE_HEIGHT, defaultHeight: PADDLE_HEIGHT, speedMultiplier: 1, color: CPU_COLOR };
            invisiWall = null;
            activePowerUps = [];
            Object.values(activeEffects).forEach(effect => clearTimeout(effect.timeoutId));
            activeEffects = {};
            if (powerUpSpawner) clearInterval(powerUpSpawner);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            availableQuestions = [...allQuestions];
            
            initStars();
            
            currentScreen = 'rules';
            gameLoop();
        }

        function startGame() {
            // Set point multiplier, cpuLevel, and ball speed based on difficulty
            if (currentDifficulty === 'Easy') {
                pointMultiplier = 1;
                baseCpuLevel = 0.07;
                BASE_SPEED = 7.5;
            } else if (currentDifficulty === 'Normal') {
                pointMultiplier = 2;
                baseCpuLevel = 0.10;
                BASE_SPEED = 10.0;
            } else if (currentDifficulty === 'Hard') {
                pointMultiplier = 3;
                baseCpuLevel = 0.15;
                BASE_SPEED = 13.0;
            }
            cpuLevel = baseCpuLevel;

            currentScreen = 'playing';
            gameActive = true; 
            gamePaused = false;
            lastPowerUpSpawnTime = Date.now();
            powerUpSpawner = setInterval(spawnPowerUp, powerUpIntervalTime);
        }

        function update() {
            if (currentScreen !== 'playing' || gamePaused) return;

            player.y += (player.targetY - player.y) * player.speed * player.speedMultiplier;
            cpu.y += (ball.y - (cpu.y + cpu.height / 2)) * cpuLevel * cpu.speedMultiplier;
            if (cpu.y < 0) cpu.y = 0; if (cpu.y + cpu.height > canvas.height) cpu.y = canvas.height - cpu.height;
            
            ball.x += ball.dx; ball.y += ball.dy;
            if (activeEffects['ghostBall']) { ball.pulseTime += 0.1; ball.alpha = 0.5 + Math.sin(ball.pulseTime) * 0.5; }

            if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
                ball.dy *= -1;
                const wallY = ball.y - ball.radius < 0 ? 0 : canvas.height;
                createParticles(ball.x, wallY, BALL_COLOR, 10);
                ball.y = ball.y - ball.radius < 0 ? ball.radius : canvas.height - ball.radius;
            }
            
            if (invisiWall && isCollision(ball, invisiWall)) {
                ball.dx *= -1;
                const offset = ball.radius + 1;
                ball.x = (invisiWall.owner === 'player') ? invisiWall.x + invisiWall.width + offset : invisiWall.x - offset;
                createParticles(ball.x, ball.y, '#4ade80', 15);
            }

            let paddle = (ball.x < canvas.width / 2) ? player : cpu;
            if (isCollision(ball, paddle)) {
                lastPaddleHit = (paddle === player) ? 'player' : 'cpu';
                volleyCount++; totalScore += pointMultiplier;
                ball.speed += VOLLEY_SPEED_INCREASE;
                createParticles(ball.x, ball.y, paddle.color, 25);
                let collidePoint = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
                let angleRad = (Math.PI / 4) * collidePoint;
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;
                ball.dx = direction * ball.speed * Math.cos(angleRad); ball.dy = ball.speed * Math.sin(angleRad);
            }

            activePowerUps.forEach((p, index) => { if (Math.hypot(ball.x - p.x, ball.y - p.y) < ball.radius + p.size / 2) { activatePowerUp(p.type, lastPaddleHit); activePowerUps.splice(index, 1); } });
            if (ball.x - ball.radius < 0) { lastScorer = 'cpu'; handleScore(); } else if (ball.x + ball.radius > canvas.width) { lastScorer = 'player'; handleScore(); }
        }

        function clearAllPowerUps() {
            const effectsToClear = Object.keys(activeEffects);
            effectsToClear.forEach(type => {
                if (activeEffects[type] && activeEffects[type].timeoutId) {
                    clearTimeout(activeEffects[type].timeoutId);
                }
                deactivatePowerUp(type);
            });
            // Clear any power-ups still on the screen
            activePowerUps = [];
        }

        function handleScore() {
            triggerScreenShake();
            clearAllPowerUps(); // Clear power-ups when a point is scored
            gameActive = false; // Pause game until question is answered
            if (lastScorer === 'cpu') { score.cpu++; }
            if (score.player >= WINNING_SCORE || score.cpu >= WINNING_SCORE) { handleMatchEnd(); return; }
            displayQuestion();
        }

        // --- RENDER FUNCTIONS ---
        function render() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawStars();

            switch(currentScreen) {
                case 'playing':
                case 'paused':
                    renderGame();
                    break;
                case 'rules':
                    renderModal(renderRulesContent);
                    break;
                case 'question':
                    renderModal(renderQuestionContent);
                    break;
                case 'message':
                    renderModal(renderMessageContent);
                    break;
            }
            
            updateAndDrawParticles();
            
            // Draw mouse cursor
            // This part is a placeholder for actual cursor logic if needed
            drawCursor();
        }

        function renderGame() {
            drawNet();
            
            // Draw Paddles with Glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowColor = cpu.color;
            ctx.fillStyle = cpu.color;
            ctx.fillRect(cpu.x, cpu.y, cpu.width, cpu.height);

            // Draw Powerups
            activePowerUps.forEach(p => { const typeInfo = powerUpTypes[p.type]; if (typeInfo.img.complete) { ctx.drawImage(typeInfo.img, p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); } });
            if (invisiWall) { ctx.fillStyle = "rgba(74, 222, 128, 0.3)"; ctx.fillRect(invisiWall.x, invisiWall.y, invisiWall.width, invisiWall.height); ctx.strokeStyle = "rgba(74, 222, 128, 0.7)"; ctx.strokeRect(invisiWall.x, invisiWall.y, invisiWall.width, invisiWall.height); }
            
            // Draw Ball with Glow
            ctx.shadowColor = ball.color;
            ctx.fillStyle = ball.color;
            ctx.globalAlpha = ball.alpha;
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
            
            renderGameUI();

            if (currentScreen === 'paused') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = `${canvas.width / 15}px 'Press Start 2P'`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }

        function renderGameUI() {
            // Draw Scores
            const scoreFontSize = Math.max(20, canvas.width / 40);
            ctx.font = `${scoreFontSize}px 'Press Start 2P'`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.shadowBlur = 10;

            ctx.shadowColor = PLAYER_COLOR;
            ctx.fillStyle = PLAYER_COLOR;
            ctx.fillText(`Player: ${score.player}`, 20, 20);

            ctx.textAlign = 'right';
            ctx.shadowColor = CPU_COLOR;
            ctx.fillStyle = CPU_COLOR;
            ctx.fillText(`CPU: ${score.cpu}`, canvas.width - 20, 20);
            
            ctx.textAlign = 'center';
            const totalScoreFontSize = Math.max(16, canvas.width / 60);
            ctx.font = `${totalScoreFontSize}px 'Press Start 2P'`;
            ctx.shadowColor = 'white';
            ctx.fillStyle = 'white';
            ctx.fillText(`Total: ${totalScore}`, canvas.width / 2, 20);

            // Draw Powerup Status Icons
            let iconX = canvas.width / 2 - (Object.keys(activeEffects).length * (32 + 10) / 2);
            for (const type in activeEffects) {
                const img = powerUpTypes[type].img;
                if (img.complete) {
                    ctx.drawImage(img, iconX, 20 + scoreFontSize + 10, 32, 32);
                    iconX += 32 + 10;
                }
            }
            
            // Draw controls
            const bottomMargin = 20;
            const controlsFontSize = Math.max(12, canvas.width / 80);
            ctx.font = `${controlsFontSize}px 'Press Start 2P'`;
            ctx.fillText(`${gamePaused ? "Resume" : "Pause"} (Space)`, canvas.width / 2, canvas.height - bottomMargin);
            ctx.fillText(`Difficulty: ${currentDifficulty}`, canvas.width / 2, canvas.height - bottomMargin - (controlsFontSize + 10));

            ctx.shadowBlur = 0;
        }

        function renderModal(contentRenderer) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const modalWidth = canvas.width * 0.8;
            const modalHeight = canvas.height * 0.8;
            const modalX = (canvas.width - modalWidth) / 2;
            const modalY = (canvas.height - modalHeight) / 2;

            ctx.strokeStyle = PLAYER_COLOR;
            ctx.fillStyle = '#111';
            ctx.shadowBlur = 20;
            ctx.shadowColor = CPU_COLOR;

            ctx.beginPath();
            ctx.rect(modalX, modalY, modalWidth, modalHeight);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            contentRenderer(modalX, modalY, modalWidth, modalHeight);
        }

        function renderRulesContent(mx, my, mw, mh) {
            uiButtons = [];
            const padding = mw * 0.05;
            const contentWidth = mw - padding * 2;
            let currentY = my + padding;

            ctx.fillStyle = '#FFF';
            ctx.textAlign = 'center';
            const titleSize = Math.max(16, mw/30);
            ctx.font = `${titleSize}px 'Press Start 2P'`;
            ctx.fillText("Game Rules & Power-ups", mx + mw / 2, currentY);
            currentY += titleSize * 2.5;

            ctx.textAlign = 'left';
            const textSize = Math.max(10, mw/60);
            const lineHeight = textSize * 1.6;
            ctx.font = `${textSize}px 'Press Start 2P'`;

            const rules = [
                "• Use mouse/finger to move the paddle.",
                "• Score by getting the ball past the opponent.",
                "• First to 10 points wins the match!",
                "• The game ends only when you lose a match."
            ];
            rules.forEach(rule => {
                ctx.fillText(rule, mx + padding, currentY);
                currentY += lineHeight;
            });

            currentY += lineHeight;
            
            // Difficulty Buttons
            const btnW = mw / 4;
            const btnH = mh / 12;
            const btnY = my + mh - btnH * 2.5;
            const difficulties = [
                { id: 'diffEasy', text: 'Easy', level: 0.07 },
                { id: 'diffNormal', text: 'Normal', level: 0.10 },
                { id: 'diffHard', text: 'Hard', level: 0.15 }
            ];
            
            difficulties.forEach((diff, i) => {
                const btnX = mx + (mw / 2) - (difficulties.length * btnW * 1.1 / 2) + i * (btnW * 1.1);
                 uiButtons.push({
                    ...diff, x: btnX, y: btnY, width: btnW, height: btnH, selected: currentDifficulty === diff.text,
                    action: () => { currentDifficulty = diff.text; }
                });
            });

            // Start Button
            uiButtons.push({
                id: 'startGame', x: mx + mw / 2 - btnW, y: my + mh - btnH * 1.2, width: btnW * 2, height: btnH,
                text: 'Start Game', action: startGame
            });

            drawButtons(uiButtons);
        }

        function renderQuestionContent(mx, my, mw, mh) {
             uiButtons = [];
            const padding = mw * 0.05;
            let currentY = my + padding;

            ctx.fillStyle = '#FFF';
            ctx.textAlign = 'center';
            const titleSize = Math.max(16, mw/30);
            ctx.font = `${titleSize}px 'Press Start 2P'`;
            ctx.fillText("History Question!", mx + mw / 2, currentY);
            currentY += titleSize * 2;
            
            const question = lastQuestion.question.question;
            const textSize = Math.max(12, mw/55);
            const lineHeight = textSize * 1.5;
            currentY = wrapText(question, mx + mw / 2, currentY, mw - padding * 2, lineHeight, `${textSize}px 'Press Start 2P'`) + lineHeight * 2;
            
            const btnW = mw * 0.8;
            const btnH = mh * 0.12;
            const btnX = mx + (mw - btnW) / 2;
            
            lastQuestion.shuffledAnswers.forEach((answer, i) => {
                uiButtons.push({
                    x: btnX, y: currentY, width: btnW, height: btnH, text: answer,
                    action: () => checkAnswer(answer === lastQuestion.question.correctAnswer)
                });
                currentY += btnH * 1.2;
            });
            drawButtons(uiButtons);
        }
        
        function renderMessageContent(mx, my, mw, mh) {
            uiButtons = [];
            ctx.fillStyle = '#FFF';
            ctx.textAlign = 'center';
            const textSize = Math.max(16, mw/35);
            const lineHeight = textSize * 1.5;
            wrapText(messageConfig.text, mx + mw / 2, my + mh/3, mw * 0.9, lineHeight, `${textSize}px 'Press Start 2P'`);

            const btnW = mw * 0.4;
            const btnH = mh * 0.15;
            uiButtons.push({
                x: mx + (mw - btnW) / 2, y: my + mh - btnH * 1.5, width: btnW, height: btnH,
                text: 'Continue',
                action: () => {
                    currentScreen = 'playing';
                    if (messageConfig.callback) messageConfig.callback();
                }
            });
            drawButtons(uiButtons);
        }

        function drawButtons(buttons) {
            buttons.forEach(btn => {
                let fontSize = Math.max(12, btn.height / 3); // Start with a base font size
                ctx.font = `${fontSize}px 'Press Start 2P'`;
                let textWidth = ctx.measureText(btn.text).width;
                const padding = 20; // 10px padding on each side

                // Reduce font size until text fits
                while (textWidth > btn.width - padding && fontSize > 8) {
                    fontSize--;
                    ctx.font = `${fontSize}px 'Press Start 2P'`;
                    textWidth = ctx.measureText(btn.text).width;
                }
                
                if (btn.selected) {
                    ctx.fillStyle = PLAYER_COLOR;
                    ctx.fillRect(btn.x, btn.y, btn.width, btn.height);
                    ctx.fillStyle = '#000';
                } else {
                    ctx.strokeStyle = PLAYER_COLOR;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(btn.x, btn.y, btn.width, btn.height);
                    ctx.fillStyle = PLAYER_COLOR;
                }
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(btn.text, btn.x + btn.width / 2, btn.y + btn.height / 2);
            });
        }
        
        function drawNet() {
            ctx.shadowBlur = 15;
            ctx.shadowColor = NET_COLOR;
            const pulse = Math.abs(Math.sin(Date.now() * 0.001)) * 0.5 + 0.5;
            ctx.globalAlpha = pulse;
            ctx.fillStyle = NET_COLOR;
            for (let i = 0; i <= canvas.height; i += 15) {
                ctx.fillRect(canvas.width / 2 - 1, i, 2, 10);
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }
        
        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx; p.y += p.dy; p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
        }

        function drawCursor() {
            // We don't need a custom cursor during gameplay, the paddle serves that purpose.
            if (currentScreen === 'playing' || currentScreen === 'paused') {
                return;
            }
            // Draw a custom cursor for menu screens
            ctx.fillStyle = PLAYER_COLOR;
            ctx.shadowBlur = 5;
            ctx.shadowColor = PLAYER_COLOR;
            ctx.beginPath();
            ctx.arc(mousePos.x, mousePos.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        // --- LOGIC FUNCTIONS (Mostly unchanged but adapted for state machine) ---
        function displayQuestion() {
            if (availableQuestions.length === 0) availableQuestions = [...allQuestions];
            const qIndex = Math.floor(Math.random() * availableQuestions.length);
            const questionData = availableQuestions[qIndex];
            lastQuestion = {
                question: questionData,
                index: qIndex,
                shuffledAnswers: [...questionData.answers].sort(() => Math.random() - 0.5)
            };
            currentScreen = 'question';
        }

        function checkAnswer(isCorrect) {
            let message = "";
            if (lastScorer === 'player') {
                if (isCorrect) { 
                    score.player += 2; 
                    message = `Correct! You get 2 points!`; 
                } 
                else { 
                    score.player += 1;
                    message = `Incorrect. You still get 1 point.`;
                }
            } else {
                if (isCorrect) { message = "Correct! You blocked the bonus point!"; } 
                else { score.cpu++; message = "Incorrect! CPU gets a bonus point!"; }
            }
            if(isCorrect) { availableQuestions.splice(lastQuestion.index, 1); }
            resetBall();
            
            showMessage(message, () => {
                setTimeout(() => {
                    if (score.player >= WINNING_SCORE || score.cpu >= WINNING_SCORE) { handleMatchEnd(); } 
                    else { gameActive = true; currentScreen = 'playing'; }
                }, 1000);
            });
        }
        
        function showMessage(msg, callback) {
            messageConfig = { text: msg, callback: callback };
            currentScreen = 'message';
        }

        function togglePause() {
            if (currentScreen !== 'playing' && currentScreen !== 'paused') return;
            gamePaused = !gamePaused;
            currentScreen = gamePaused ? 'paused' : 'playing';

            if (gamePaused) {
                cancelAnimationFrame(animationFrameId);
                clearInterval(powerUpSpawner);
                powerUpIntervalTime = Math.max(0, 7000 - (Date.now() - lastPowerUpSpawnTime));
                for (const type in activeEffects) {
                    const effect = activeEffects[type];
                    clearTimeout(effect.timeoutId);
                    effect.remainingTime = powerUpTypes[type].duration - (Date.now() - effect.startTime);
                }
            } else {
                lastPowerUpSpawnTime = Date.now();
                powerUpSpawner = setTimeout(() => { spawnPowerUp(); clearInterval(powerUpSpawner); powerUpSpawner = setInterval(spawnPowerUp, 7000); }, powerUpIntervalTime);
                for (const type in activeEffects) {
                    const effect = activeEffects[type];
                    if (effect.remainingTime > 0) {
                        effect.startTime = Date.now();
                        effect.timeoutId = setTimeout(() => deactivatePowerUp(type), effect.remainingTime);
                    } else { deactivatePowerUp(type); }
                }
            }
        }
        
        function handleMatchEnd() {
            gameActive = false;
            if (powerUpSpawner) clearInterval(powerUpSpawner);
            if (score.player >= WINNING_SCORE) {
                const winBonus = 100 * pointMultiplier;
                totalScore += winBonus;
                const message = `Match Won! +${winBonus} Bonus! Prepare for the next round.`;
                showMessage(message, startNextMatch);
            } else {
                const finalMessage = `Game Over. Final Score: ${totalScore}. Play again?`;
                showMessage(finalMessage, init);
            }
        }

        function startNextMatch() {
            score = { player: 0, cpu: 0 };
            baseCpuLevel += DIFFICULTY_INCREASE_RATE;
            cpuLevel = baseCpuLevel;
            for (const type in activeEffects) { deactivatePowerUp(type); }
            activePowerUps = [];
            resetBall();
            gameActive = true;
            currentScreen = 'playing';
        }

        // --- UNMODIFIED OR MINIMALLY MODIFIED HELPERS ---
        function updateScoreDisplay() {} // No longer needed for DOM
        function gameLoop() { 
            if (!gamePaused) {
                update(); 
            }
            render(); 
            animationFrameId = requestAnimationFrame(gameLoop); 
        }
        function isCollision(b, p) { return p.x < b.x + b.radius && p.x + p.width > b.x - b.radius && p.y < b.y + b.radius && p.y + p.height > b.y - b.radius; }
        function resetBall() { volleyCount = 0; ball.x = canvas.width / 2; ball.y = canvas.height / 2; ball.speed = activeEffects['speedBoost'] ? BASE_SPEED * 1.5 : BASE_SPEED; ball.dx = (lastScorer === 'player') ? -ball.speed : ball.speed; ball.dy = ball.speed * (Math.random() > 0.5 ? 1 : -1) * 0.7; cpuLevel += CPU_IMPROVEMENT_RATE; }
        function spawnPowerUp() { if (gamePaused || activePowerUps.length >= 2 || currentScreen !== 'playing') return; const type = Object.keys(powerUpTypes)[Math.floor(Math.random() * Object.keys(powerUpTypes).length)]; activePowerUps.push({ x: Math.random() * (canvas.width * 0.6) + (canvas.width * 0.2), y: Math.random() * (canvas.height * 0.8) + (canvas.height * 0.1), size: POWERUP_SIZE, type: type }); lastPowerUpSpawnTime = Date.now(); }
        function activatePowerUp(type, hitter) { if (activeEffects[type]) clearTimeout(activeEffects[type].timeoutId); const powerUpInfo = powerUpTypes[type]; switch(type) { case 'speedBoost': ball.speed = BASE_SPEED * 1.5; break; case 'largePaddle': if(hitter === 'player') player.height = player.defaultHeight * 1.5; else cpu.height = cpu.defaultHeight * 1.5; break; case 'smallPaddle': player.height = player.defaultHeight * 0.5; cpu.height = cpu.defaultHeight * 0.5; break; case 'ghostBall': ball.alpha = 0.5; ball.pulseTime = 0; break; case 'slowDown': player.speedMultiplier = 0.3; cpu.speedMultiplier = 0.3; break; case 'invisiWall': invisiWall = { owner: hitter, x: (hitter === 'player' ? player.x + player.width + 5 : cpu.x - 15), y: 0, width: 10, height: canvas.height }; break; } activeEffects[type] = { startTime: Date.now(), timeoutId: setTimeout(() => deactivatePowerUp(type), powerUpInfo.duration), hitter: hitter }; }
        function deactivatePowerUp(type) { const hitter = activeEffects[type] ? activeEffects[type].hitter : null; switch(type) { case 'speedBoost': ball.speed = BASE_SPEED; break; case 'largePaddle': if(hitter === 'player') player.height = player.defaultHeight; else cpu.height = cpu.defaultHeight; break; case 'smallPaddle': player.height = player.defaultHeight; cpu.height = cpu.defaultHeight; break; case 'ghostBall': ball.alpha = 1; break; case 'slowDown': player.speedMultiplier = 1; cpu.speedMultiplier = 1; break; case 'invisiWall': invisiWall = null; break; } delete activeEffects[type]; }

        // --- EVENT LISTENERS ---
        function handleInteractionStart(e) {
            const pos = getInteractionPos(e);
            if (e.type === 'touchstart') {
                touchStartY = pos.y;
                paddleStartY = player.y;
            }
            if (currentScreen !== 'playing' && currentScreen !== 'paused') {
                uiButtons.forEach(button => {
                    if (pos.x > button.x && pos.x < button.x + button.width && pos.y > button.y && pos.y < button.y + button.height) {
                        if(button.action) button.action();
                    }
                });
            }
        }
        
        function handleInteractionMove(e) {
            e.preventDefault();
            const pos = getInteractionPos(e);
            mousePos.x = pos.x; // Update mouse position for custom cursor
            mousePos.y = pos.y;
            let newTargetY;
            if (e.type === 'touchmove') {
                 let deltaY = pos.y - touchStartY;
                 newTargetY = paddleStartY + deltaY;
            } else { // mousemove
                newTargetY = pos.y;
            }
            if (newTargetY < player.height / 2) newTargetY = player.height / 2;
            if (newTargetY > canvas.height - player.height / 2) newTargetY = canvas.height - player.height / 2;
            player.targetY = newTargetY - player.height / 2;
        }

        function getInteractionPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            // Scale mouse coordinates to canvas coordinates
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }
        
        document.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePause(); } });
        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener('mousedown', handleInteractionStart);
        canvas.addEventListener('mousemove', handleInteractionMove);
        canvas.addEventListener('touchstart', handleInteractionStart, { passive: false });
        canvas.addEventListener('touchmove', handleInteractionMove, { passive: false });

        // Populate questions (truncated for brevity)
        allQuestions.push(
            { question: "What was the primary motivation for the Virginia Company to establish the Jamestown colony?", answers: ["To create a haven for religious freedom", "To discover a new route to Asia", "To make a profit for its investors"], correctAnswer: "To make a profit for its investors" },
            { question: "The movement of goods, people, and diseases between the Old World and the New World is known as the:", answers: ["Triangle Trade", "Columbian Exchange", "Middle Passage"], correctAnswer: "Columbian Exchange" },
            { question: "Which of the following is the BEST definition of colonization?", answers: ["When people visit a new country for a short time", "When a country establishes control over a new land and settles it", "When two countries agree to trade with each other"], correctAnswer: "When a country establishes control over a new land and settles it" },
            { question: "The term 'New World' was used by Europeans to refer to:", answers: ["Africa and Asia", "North and South America", "Australia and New Zealand"], correctAnswer: "North and South America" },
            { question: "Mercantilism was an economic theory that encouraged nations to:", answers: ["Import more goods than they export", "Establish colonies to gain resources and wealth", "Promote free trade between all countries"], correctAnswer: "Establish colonies to gain resources and wealth" },
            { question: "The Massachusetts Bay Colony was founded primarily by which group?", answers: ["Quakers seeking peace", "Puritans seeking religious freedom", "Catholics escaping persecution in England"], correctAnswer: "Puritans seeking religious freedom" },
            { question: "In the Triangle Trade system, what was transported from Africa to the Americas?", answers: ["Manufactured goods like rum and guns", "Enslaved people", "Raw materials like sugar and tobacco"], correctAnswer: "Enslaved people" }
            // ... Add all other questions here from the original script
        );

        // Initial Load
        window.onload = () => {
            // Set font for the first time to ensure it's loaded for text measurements
            ctx.font = "10px 'Press Start 2P'";
            // A small delay to help ensure the font is ready before the first render
            setTimeout(() => {
                resizeCanvas();
                init();
            }, 100);
        };
    </script>
