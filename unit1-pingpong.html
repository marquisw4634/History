<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Test Pong - Full Canvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Tone.js for audio synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #000;
            color: #ffffff;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        canvas {
            background-color: #000000;
            display: block;
            /* Glow effect for a bloom/CRT monitor look */
            filter: drop-shadow(0 0 5px #00ffff) drop-shadow(0 0 10px #ff00ff);
        }
        /* Screen Shake Animation */
        @keyframes shake {
            0% { transform: translate(1px, 1px); } 10% { transform: translate(-1px, -2px); }
            20% { transform: translate(-3px, 0px); } 30% { transform: translate(3px, 2px); }
            40% { transform: translate(1px, -1px); } 50% { transform: translate(-1px, 2px); }
            60% { transform: translate(-3px, 1px); } 70% { transform: translate(3px, 1px); }
            80% { transform: translate(-1px, -1px); } 90% { transform: translate(1px, 2px); }
            100% { transform: translate(0, 0); }
        }
        .screen-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body>
    <canvas id="pongCanvas"></canvas>

    <script>
        // --- DOM Elements ---
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        // --- Game State & Configuration ---
        let ball, player, cpu, score, invisiWall;
        let totalScore, volleyCount;
        let gameActive = false;
        let gamePaused = false;
        let lastScorer = null;
        let lastPaddleHit = null;
        let powerUpSpawner, powerUpIntervalTime = 7000, lastPowerUpSpawnTime;
        let activePowerUps = [], activeEffects = {};
        let cpuLevel = 0.10, baseCpuLevel = 0.10;
        let animationFrameId;
        let availableQuestions = [];
        let lastQuestion = null;
        let touchStartY = 0, paddleStartY = 0;
        let currentScreen = 'rules'; // 'rules', 'playing', 'paused', 'question', 'message'
        let messageConfig = { text: '', callback: null };
        let uiButtons = []; // Holds clickable UI elements for the current screen
        let currentDifficulty = 'Normal';
        let pointMultiplier = 1; // Added for difficulty-based scoring
        let mousePos = { x: 0, y: 0 }; // Added to track mouse cursor position

        // --- NEW AUDIO STATE ---
        let audio;
        let isMuted = false;
        let audioInitialized = false;

        // --- NEW GRAPHICS STATE ---
        let particles = [];
        let stars = [];
        const PLAYER_COLOR = '#00ffff';
        const CPU_COLOR = '#ff00ff';
        const BALL_COLOR = '#ffffff';
        const NET_COLOR = 'rgba(255, 255, 255, 0.5)';
        
        // --- Game Constants ---
        const PADDLE_HEIGHT = 100, PADDLE_WIDTH = 10;
        const BALL_RADIUS = 10, WINNING_SCORE = 10, POWERUP_SIZE = 40;
        let BASE_SPEED = 7.5;
        const CPU_IMPROVEMENT_RATE = 0.002;
        const VOLLEY_SPEED_INCREASE = 0.1, DIFFICULTY_INCREASE_RATE = 0.01;

        // --- Powerup SVGs and Types ---
        const powerUpTypes = { 'speedBoost': { duration: 10000, text: "Speed Boost: Ball moves faster.", svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ef4444"><path d="M12 2L6 8v5c0 2.21 1.79 4 4 4h4c2.21 0 4-1.79 4-4V8l-6-6zm-2 15v-5h4v5h-4z"/></svg>`}, 'largePaddle': { duration: 10000, text: "Large Paddle: Hitter's paddle grows.", svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#3b82f6"><path d="M21 9h-4V5h-2v4H7V5H5v4H1v2h4v4h2v-4h10v4h2v-4h4V9z"/></svg>`}, 'smallPaddle': { duration: 10000, text: "Small Paddle: Both paddles shrink.", svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#facc15"><path d="M15 19v-4h4v-2h-4V9h4V7h-4V3h-2v4H7v2h4v4H7v2h4v4h2z"/></svg>`}, 'ghostBall': { duration: 10000, text: "Ghost Ball: Ball pulses in and out.", svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#a8a29e"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-2-9h4v2h-4v3l-4-4 4-4v3z"/></svg>`}, 'slowDown': { duration: 5000, text: "Slow Down: Both paddles move slower.", svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#38bdf8"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm5.7 14.3a.7.7 0 11-1 1l-5-5-2.8 2.8a.7.7 0 01-1-1L12 11l5.7 3.3zM8 8a2 2 0 114 0 2 2 0 01-4 0z"/></svg>`}, 'invisiWall': { duration: 10000, text: "Invisi-Wall: A shield protects the hitter's goal.", svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#4ade80"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>`} };
        Object.values(powerUpTypes).forEach(type => { const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(type.svg); type.img = img; });
        
        const allQuestions = [
            // All questions from the original script are assumed to be here
            { question: "What was the primary motivation for the Virginia Company to establish the Jamestown colony?", answers: ["To create a haven for religious freedom", "To discover a new route to Asia", "To make a profit for its investors"], correctAnswer: "To make a profit for its investors" },
            { question: "The movement of goods, people, and diseases between the Old World and the New World is known as the:", answers: ["Triangle Trade", "Columbian Exchange", "Middle Passage"], correctAnswer: "Columbian Exchange" },
            { question: "Which of the following is the BEST definition of colonization?", answers: ["When people visit a new country for a short time", "When a country establishes control over a new land and settles it", "When two countries agree to trade with each other"], correctAnswer: "When a country establishes control over a new land and settles it" },
            { question: "The term 'New World' was used by Europeans to refer to:", answers: ["Africa and Asia", "North and South America", "Australia and New Zealand"], correctAnswer: "North and South America" },
            { question: "Mercantilism was an economic theory that encouraged nations to:", answers: ["Import more goods than they export", "Establish colonies to gain resources and wealth", "Promote free trade between all countries"], correctAnswer: "Establish colonies to gain resources and wealth" },
            { question: "The Massachusetts Bay Colony was founded primarily by which group?", answers: ["Quakers seeking peace", "Puritans seeking religious freedom", "Catholics escaping persecution in England"], correctAnswer: "Puritans seeking religious freedom" },
            { question: "In the Triangle Trade system, what was transported from Africa to the Americas?", answers: ["Manufactured goods like rum and guns", "Enslaved people", "Raw materials like sugar and tobacco"], correctAnswer: "Enslaved people" }
        ];

        // --- AUDIO FUNCTIONS ---
        function initAudio() {
            // Effects
            const reverb = new Tone.Reverb(1.5).toDestination();
            const filter = new Tone.AutoFilter("4n").toDestination().start();

            // --- REFINED SMOOTH MUSIC ---
            // A smooth, warm polysynth for chords
            const chordSynth = new Tone.PolySynth(Tone.FMSynth, {
                harmonicity: 1.5,
                modulationIndex: 1.2,
                oscillator: { type: "sine" },
                envelope: { attack: 0.1, decay: 0.2, sustain: 0.5, release: 1.5 },
                modulation: { type: "sine" },
                modulationEnvelope: { attack: 0.2, decay: 0.1, sustain: 0.5, release: 0.8 }
            }).connect(reverb);
            chordSynth.volume.value = -12;

            // A deep, round bass synth
            const bassSynth = new Tone.MonoSynth({
                oscillator: { type: 'sine' },
                envelope: { attack: 0.05, decay: 0.3, sustain: 0.4, release: 1.4 },
                filterEnvelope: { attack: 0.01, decay: 0.1, sustain: 0.8, baseFrequency: 200, octaves: 2.6 }
            }).connect(reverb);
            bassSynth.volume.value = -6;

            // Simple drum machine
            const kick = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 10, oscillator: { type: 'sine' }, envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 1.4, attackCurve: 'exponential' } }).toDestination();
            kick.volume.value = -4;
            // A much softer hi-hat sound to replace the percussive snare
            const closedHat = new Tone.NoiseSynth({
                noise: { type: "white" },
                envelope: { attack: 0.001, decay: 0.05, sustain: 0 },
                filter: { type: 'highpass', Q: 1, frequency: 7000 },
            }).toDestination();
            closedHat.volume.value = -20;


            // FIX: Re-implement music playback using Tone.Part to avoid scheduling errors.
            // This provides a declarative, stable timeline for all musical events.
            const chordEvents = [
                { time: '0:0', notes: ['A#2', 'C#3', 'F3', 'G#3'] }, // A#m7
                { time: '1:0', notes: ['G#2', 'C3', 'D#3', 'G3'] },  // G#maj7
                { time: '2:0', notes: ['C#3', 'F3', 'G3', 'A#3'] },  // C#maj7
                { time: '3:0', notes: ['F#2', 'A#2', 'C#3', 'F3'] }   // F#maj7
            ];

            const chordPart = new Tone.Part((time, value) => {
                chordSynth.triggerAttackRelease(value.notes, '1m', time);
            }, chordEvents).start(0);
            chordPart.loop = true;
            chordPart.loopEnd = '4m';

            const bassPart = new Tone.Part((time, value) => {
                const rootNote = value.notes[0];
                const bassNote = rootNote.slice(0, -1) + (parseInt(rootNote.slice(-1)) - 1);
                bassSynth.triggerAttackRelease(bassNote, '2n', time);
            }, chordEvents).start(0);
            bassPart.loop = true;
            bassPart.loopEnd = '4m';

            const drumPart = new Tone.Part((time, instrument) => {
                if (instrument === 'kick') {
                    kick.triggerAttackRelease('C1', '8n', time);
                } else {
                    closedHat.triggerAttackRelease('16n', time);
                }
            }, [
                // A gentler, shuffling beat with a soft hi-hat
                { time: '0:0', instrument: 'kick' }, { time: '0:1:2', instrument: 'hat'}, { time: '0:2', instrument: 'kick'}, { time: '0:3:2', instrument: 'hat'},
                { time: '1:0', instrument: 'kick' }, { time: '1:1:2', instrument: 'hat'}, { time: '1:2', instrument: 'kick'}, { time: '1:3:2', instrument: 'hat'},
                { time: '2:0', instrument: 'kick' }, { time: '2:1:2', instrument: 'hat'}, { time: '2:2', instrument: 'kick'}, { time: '2:3:2', instrument: 'hat'},
                { time: '3:0', instrument: 'kick' }, { time: '3:1:2', instrument: 'hat'}, { time: '3:2', instrument: 'kick'}, { time: '3:3:2', instrument: 'hat'}
            ]).start(0);
            drumPart.loop = true;
            drumPart.loopEnd = '4m';


            Tone.Transport.bpm.value = 75; // A nice chill tempo
            
            audio = {
                music: { transport: Tone.Transport, parts: [chordPart, bassPart, drumPart] },
                sfx: {
                    paddleHit: new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(),
                    wallHit: new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.005, decay: 0.05, sustain: 0, release: 0.1 } }).toDestination(),
                    score: new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.2, release: 0.5 } }).toDestination(),
                    powerupSpawn: new Tone.Synth({ oscillator: { type: 'triangle8' }, envelope: { attack: 0.1, decay: 0.2, sustain: 0, release: 0.3 } }).toDestination(),
                    powerupGet: new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.2 } }).toDestination(),
                    click: new Tone.MembraneSynth({ pitchDecay: 0.008, octaves: 4, envelope: { attack: 0.001, decay: 0.1, sustain: 0 } }).toDestination(),
                    correct: new Tone.PluckSynth({ attackNoise: 0.5, dampening: 4000, resonance: 0.7 }).toDestination(),
                    incorrect: new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.2 } }).toDestination(),
                }
            };
            audio.sfx.paddleHit.volume.value = -12;
            audio.sfx.wallHit.volume.value = -16;
            audio.sfx.score.volume.value = -10;
            audio.sfx.click.volume.value = -20;
            audio.sfx.correct.volume.value = -8;
            audio.sfx.incorrect.volume.value = -12;
            
            audioInitialized = true;
        }

        function playSound(sound, note = 'C4', duration = '8n', forcePlay = false) {
            if (!audioInitialized) return;
            if (isMuted && !forcePlay) return;

            if (sound.triggerAttackRelease) {
                // By adding a small offset to Tone.now(), we ensure the start time is always
                // strictly greater than the previous event, preventing the scheduling error.
                sound.triggerAttackRelease(note, duration, Tone.now() + 0.01);
            }
        }
        
        function toggleMute() {
            isMuted = !isMuted;
            Tone.Destination.mute = isMuted;
            playSound(audio.sfx.click, 'C4', '8n', true); // Force play the click sound
        }

        // --- GRAPHICS & UTILITY FUNCTIONS ---
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 1.5, alpha: Math.random() * 0.5 + 0.5, dx: (Math.random() - 0.5) * 0.1 });
            }
        }

        function drawStars() {
            stars.forEach(star => {
                star.x += star.dx;
                if (star.x < 0) star.x = canvas.width;
                if (star.x > canvas.width) star.x = 0;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            });
        }

        function createParticles(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push({ x, y, radius: Math.random() * 2 + 1, color, dx: (Math.random() - 0.5) * (Math.random() * 6), dy: (Math.random() - 0.5) * (Math.random() * 6), alpha: 1, decay: Math.random() * 0.05 + 0.01 });
            }
        }
        
        function triggerScreenShake() {
            canvas.classList.add('screen-shake');
            setTimeout(() => canvas.classList.remove('screen-shake'), 500);
        }

        function wrapText(text, x, y, maxWidth, lineHeight, font = null) {
            if(font) ctx.font = font;
            const words = text.split(' ');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
            return y; // Return the final y position
        }

        // --- CORE GAME FUNCTIONS (REWRITTEN) ---
        function resizeCanvas() {
            const container = document.body;
            const aspectRatio = 16 / 9;
            let newWidth = container.clientWidth;
            let newHeight = container.clientHeight;

            if (newWidth / newHeight > aspectRatio) {
                newWidth = newHeight * aspectRatio;
            } else {
                newHeight = newWidth / aspectRatio;
            }
            canvas.width = newWidth * 0.95;
            canvas.height = newHeight * 0.95;
            if(gameActive || currentScreen !== 'rules') init();
        }

        function init() {
            score = { player: 0, cpu: 0 };
            totalScore = 0; volleyCount = 0;
            ball = { x: canvas.width / 2, y: canvas.height / 2, radius: BALL_RADIUS, speed: BASE_SPEED, dx: BASE_SPEED, dy: BASE_SPEED, color: BALL_COLOR, alpha: 1, pulseTime: 0 };
            player = { x: 10, y: canvas.height / 2 - PADDLE_HEIGHT / 2, width: PADDLE_WIDTH, height: PADDLE_HEIGHT, defaultHeight: PADDLE_HEIGHT, targetY: canvas.height / 2, speed: 0.5, speedMultiplier: 1, color: PLAYER_COLOR };
            cpu = { x: canvas.width - 10 - PADDLE_WIDTH, y: canvas.height / 2 - PADDLE_HEIGHT / 2, width: PADDLE_WIDTH, height: PADDLE_HEIGHT, defaultHeight: PADDLE_HEIGHT, speedMultiplier: 1, color: CPU_COLOR };
            invisiWall = null;
            activePowerUps = [];
            Object.values(activeEffects).forEach(effect => clearTimeout(effect.timeoutId));
            activeEffects = {};
            if (powerUpSpawner) clearInterval(powerUpSpawner);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            availableQuestions = [...allQuestions];
            
            initStars();
            
            currentScreen = 'rules';
            if (audio && audio.music.transport.state === 'started') {
                 audio.music.transport.stop();
            }
            gameLoop();
        }

        function startGame() {
            // Audio is now initialized on the first user interaction
            if (audioInitialized && audio.music.transport.state !== 'started') {
                audio.music.transport.start();
            }

            if (currentDifficulty === 'Easy') { pointMultiplier = 1; baseCpuLevel = 0.07; BASE_SPEED = 7.5; }
            else if (currentDifficulty === 'Normal') { pointMultiplier = 2; baseCpuLevel = 0.10; BASE_SPEED = 10.0; }
            else if (currentDifficulty === 'Hard') { pointMultiplier = 3; baseCpuLevel = 0.15; BASE_SPEED = 13.0; }
            cpuLevel = baseCpuLevel;

            currentScreen = 'playing';
            gameActive = true; 
            gamePaused = false;
            lastPowerUpSpawnTime = Date.now();
            powerUpSpawner = setInterval(spawnPowerUp, powerUpIntervalTime);
        }

        function update() {
            if (currentScreen !== 'playing' || gamePaused) return;

            player.y += (player.targetY - player.y) * player.speed * player.speedMultiplier;
            cpu.y += (ball.y - (cpu.y + cpu.height / 2)) * cpuLevel * cpu.speedMultiplier;
            if (cpu.y < 0) cpu.y = 0; if (cpu.y + cpu.height > canvas.height) cpu.y = canvas.height - cpu.height;
            
            ball.x += ball.dx; ball.y += ball.dy;
            if (activeEffects['ghostBall']) { ball.pulseTime += 0.1; ball.alpha = 0.5 + Math.sin(ball.pulseTime) * 0.5; }

            if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
                ball.dy *= -1;
                const wallY = ball.y - ball.radius < 0 ? 0 : canvas.height;
                createParticles(ball.x, wallY, BALL_COLOR, 10);
                ball.y = ball.y - ball.radius < 0 ? ball.radius : canvas.height - ball.radius;
                playSound(audio.sfx.wallHit, 'C3');
            }
            
            if (invisiWall && isCollision(ball, invisiWall)) {
                ball.dx *= -1;
                const offset = ball.radius + 1;
                ball.x = (invisiWall.owner === 'player') ? invisiWall.x + invisiWall.width + offset : invisiWall.x - offset;
                createParticles(ball.x, ball.y, '#4ade80', 15);
                playSound(audio.sfx.wallHit, 'G4');
            }

            let paddle = (ball.x < canvas.width / 2) ? player : cpu;
            if (isCollision(ball, paddle)) {
                lastPaddleHit = (paddle === player) ? 'player' : 'cpu';
                volleyCount++; totalScore += pointMultiplier;
                ball.speed += VOLLEY_SPEED_INCREASE;
                createParticles(ball.x, ball.y, paddle.color, 25);
                let collidePoint = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
                let angleRad = (Math.PI / 4) * collidePoint;
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;
                ball.dx = direction * ball.speed * Math.cos(angleRad); ball.dy = ball.speed * Math.sin(angleRad);
                const pitch = 440 + (collidePoint * 100); // Pitch changes based on where it hits paddle
                playSound(audio.sfx.paddleHit, Tone.Frequency(pitch).toNote());
            }

            activePowerUps.forEach((p, index) => { if (Math.hypot(ball.x - p.x, ball.y - p.y) < ball.radius + p.size / 2) { activatePowerUp(p.type, lastPaddleHit); activePowerUps.splice(index, 1); } });
            if (ball.x - ball.radius < 0) { lastScorer = 'cpu'; handleScore(); } else if (ball.x + ball.radius > canvas.width) { lastScorer = 'player'; handleScore(); }
        }

        function clearAllPowerUps() {
            const effectsToClear = Object.keys(activeEffects);
            effectsToClear.forEach(type => {
                if (activeEffects[type] && activeEffects[type].timeoutId) {
                    clearTimeout(activeEffects[type].timeoutId);
                }
                deactivatePowerUp(type);
            });
            activePowerUps = [];
        }

        function handleScore() {
            triggerScreenShake();
            // FIX: Lowered the pitch of the player score sound from G5 to G4
            playSound(audio.sfx.score, lastScorer === 'player' ? 'G4' : 'C4', '4n');
            clearAllPowerUps();
            gameActive = false;
            if (lastScorer === 'cpu') { score.cpu++; }
            if (score.player >= WINNING_SCORE || score.cpu >= WINNING_SCORE) { handleMatchEnd(); return; }
            displayQuestion();
        }

        // --- RENDER FUNCTIONS ---
        function render() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars();

            switch(currentScreen) {
                case 'playing': case 'paused': renderGame(); break;
                case 'rules': renderModal(renderRulesContent); break;
                case 'question': renderModal(renderQuestionContent); break;
                case 'message': renderModal(renderMessageContent); break;
            }
            
            updateAndDrawParticles();
            drawCursor();
        }

        function renderGame() {
            drawNet();
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowColor = cpu.color;
            ctx.fillStyle = cpu.color;
            ctx.fillRect(cpu.x, cpu.y, cpu.width, cpu.height);

            activePowerUps.forEach(p => { const typeInfo = powerUpTypes[p.type]; if (typeInfo.img.complete) { ctx.drawImage(typeInfo.img, p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); } });
            if (invisiWall) { ctx.fillStyle = "rgba(74, 222, 128, 0.3)"; ctx.fillRect(invisiWall.x, invisiWall.y, invisiWall.width, invisiWall.height); ctx.strokeStyle = "rgba(74, 222, 128, 0.7)"; ctx.strokeRect(invisiWall.x, invisiWall.y, invisiWall.width, invisiWall.height); }
            
            ctx.shadowColor = ball.color;
            ctx.fillStyle = ball.color;
            ctx.globalAlpha = ball.alpha;
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
            
            renderGameUI();

            if (currentScreen === 'paused') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = `${canvas.width / 15}px 'Press Start 2P'`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }

        function renderGameUI() {
            const scoreFontSize = Math.max(20, canvas.width / 40);
            ctx.font = `${scoreFontSize}px 'Press Start 2P'`;
            ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.shadowBlur = 10;
            ctx.shadowColor = PLAYER_COLOR; ctx.fillStyle = PLAYER_COLOR; ctx.fillText(`Player: ${score.player}`, 20, 20);
            ctx.textAlign = 'right'; ctx.shadowColor = CPU_COLOR; ctx.fillStyle = CPU_COLOR; ctx.fillText(`CPU: ${score.cpu}`, canvas.width - 20, 20);
            
            ctx.textAlign = 'center';
            const totalScoreFontSize = Math.max(16, canvas.width / 60);
            ctx.font = `${totalScoreFontSize}px 'Press Start 2P'`;
            ctx.shadowColor = 'white'; ctx.fillStyle = 'white'; ctx.fillText(`Total: ${totalScore}`, canvas.width / 2, 20);

            let iconX = canvas.width / 2 - (Object.keys(activeEffects).length * (32 + 10) / 2);
            for (const type in activeEffects) {
                const img = powerUpTypes[type].img;
                if (img.complete) {
                    ctx.drawImage(img, iconX, 20 + scoreFontSize + 10, 32, 32);
                    iconX += 32 + 10;
                }
            }
            
            const bottomMargin = 20;
            const controlsFontSize = Math.max(12, canvas.width / 80);
            ctx.font = `${controlsFontSize}px 'Press Start 2P'`;
            ctx.fillText(`${gamePaused ? "Resume" : "Pause"} (Space)`, canvas.width / 2, canvas.height - bottomMargin);

            // Mute Button
            const muteBtnSize = controlsFontSize * 1.5;
            const muteBtnX = canvas.width - muteBtnSize - 20;
            const muteBtnY = canvas.height - muteBtnSize - bottomMargin + 5;
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.strokeRect(muteBtnX, muteBtnY, muteBtnSize, muteBtnSize);
            ctx.font = `${controlsFontSize * 1.2}px 'Press Start 2P'`;
            ctx.fillText(isMuted ? 'M' : 'S', muteBtnX + muteBtnSize / 2, muteBtnY + muteBtnSize / 2);
            uiButtons.push({id: 'muteBtn', x: muteBtnX, y: muteBtnY, width: muteBtnSize, height: muteBtnSize, action: toggleMute, isGameUI: true});


            ctx.shadowBlur = 0;
        }

        function renderModal(contentRenderer) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const modalWidth = canvas.width * 0.8;
            const modalHeight = canvas.height * 0.8;
            const modalX = (canvas.width - modalWidth) / 2;
            const modalY = (canvas.height - modalHeight) / 2;

            ctx.strokeStyle = PLAYER_COLOR; ctx.fillStyle = '#111';
            ctx.shadowBlur = 20; ctx.shadowColor = CPU_COLOR;
            ctx.beginPath(); ctx.rect(modalX, modalY, modalWidth, modalHeight);
            ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0;

            contentRenderer(modalX, modalY, modalWidth, modalHeight);
        }

        function renderRulesContent(mx, my, mw, mh) {
            uiButtons = [];
            const padding = mw * 0.05;
            const contentWidth = mw - padding * 2;
            let currentY = my + padding;

            ctx.fillStyle = '#FFF'; ctx.textAlign = 'center';
            const titleSize = Math.max(16, mw/30);
            ctx.font = `${titleSize}px 'Press Start 2P'`;
            ctx.fillText("History Pong", mx + mw / 2, currentY);
            currentY += titleSize * 2.5;

            ctx.textAlign = 'left';
            const textSize = Math.max(10, mw/60);
            const lineHeight = textSize * 1.6;
            ctx.font = `${textSize}px 'Press Start 2P'`;

            const rules = ["• Use mouse/finger to move the paddle.", "• Score by getting the ball past the opponent.", "• First to 10 points wins the match!", "• The game ends only when you lose a match."];
            rules.forEach(rule => { ctx.fillText(rule, mx + padding, currentY); currentY += lineHeight; });
            currentY += lineHeight;
            
            const btnW = mw / 4; const btnH = mh / 12; const btnY = my + mh - btnH * 2.5;
            const difficulties = [{ id: 'diffEasy', text: 'Easy', level: 0.07 }, { id: 'diffNormal', text: 'Normal', level: 0.10 }, { id: 'diffHard', text: 'Hard', level: 0.15 }];
            
            difficulties.forEach((diff, i) => {
                const btnX = mx + (mw / 2) - (difficulties.length * btnW * 1.1 / 2) + i * (btnW * 1.1);
                 uiButtons.push({ ...diff, x: btnX, y: btnY, width: btnW, height: btnH, selected: currentDifficulty === diff.text, action: () => { currentDifficulty = diff.text; } });
            });

            uiButtons.push({ id: 'startGame', x: mx + mw / 2 - btnW, y: my + mh - btnH * 1.2, width: btnW * 2, height: btnH, text: 'Start Game', action: startGame });
            drawButtons(uiButtons);
        }

        function renderQuestionContent(mx, my, mw, mh) {
             uiButtons = [];
            const padding = mw * 0.05;
            let currentY = my + padding;

            ctx.fillStyle = '#FFF'; ctx.textAlign = 'center';
            const titleSize = Math.max(16, mw/30);
            ctx.font = `${titleSize}px 'Press Start 2P'`;
            ctx.fillText("History Question!", mx + mw / 2, currentY);
            currentY += titleSize * 2;
            
            const question = lastQuestion.question.question;
            const textSize = Math.max(12, mw/55);
            const lineHeight = textSize * 1.5;
            currentY = wrapText(question, mx + mw / 2, currentY, mw - padding * 2, lineHeight, `${textSize}px 'Press Start 2P'`) + lineHeight * 2;
            
            const btnW = mw * 0.8; const btnH = mh * 0.12; const btnX = mx + (mw - btnW) / 2;
            
            lastQuestion.shuffledAnswers.forEach((answer, i) => {
                uiButtons.push({ x: btnX, y: currentY, width: btnW, height: btnH, text: answer, action: () => checkAnswer(answer === lastQuestion.question.correctAnswer) });
                currentY += btnH * 1.2;
            });
            drawButtons(uiButtons);
        }
        
        function renderMessageContent(mx, my, mw, mh) {
            uiButtons = [];
            ctx.fillStyle = '#FFF'; ctx.textAlign = 'center';
            const textSize = Math.max(16, mw/35);
            const lineHeight = textSize * 1.5;
            wrapText(messageConfig.text, mx + mw / 2, my + mh/3, mw * 0.9, lineHeight, `${textSize}px 'Press Start 2P'`);

            const btnW = mw * 0.4; const btnH = mh * 0.15;
            uiButtons.push({ x: mx + (mw - btnW) / 2, y: my + mh - btnH * 1.5, width: btnW, height: btnH, text: 'Continue', action: () => { currentScreen = 'playing'; if (messageConfig.callback) messageConfig.callback(); playSound(audio.sfx.click); } });
            drawButtons(uiButtons);
        }

        function drawButtons(buttons) {
            buttons.forEach(btn => {
                let fontSize = Math.max(12, btn.height / 3);
                ctx.font = `${fontSize}px 'Press Start 2P'`;
                let textWidth = ctx.measureText(btn.text).width;
                const padding = 20;

                while (textWidth > btn.width - padding && fontSize > 8) {
                    fontSize--; ctx.font = `${fontSize}px 'Press Start 2P'`;
                    textWidth = ctx.measureText(btn.text).width;
                }
                
                if (btn.selected) {
                    ctx.fillStyle = PLAYER_COLOR;
                    ctx.fillRect(btn.x, btn.y, btn.width, btn.height);
                    ctx.fillStyle = '#000';
                } else {
                    ctx.strokeStyle = PLAYER_COLOR; ctx.lineWidth = 2;
                    ctx.strokeRect(btn.x, btn.y, btn.width, btn.height);
                    ctx.fillStyle = PLAYER_COLOR;
                }
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(btn.text, btn.x + btn.width / 2, btn.y + btn.height / 2);
            });
        }
        
        function drawNet() {
            ctx.shadowBlur = 15;
            ctx.shadowColor = NET_COLOR;
            const pulse = Math.abs(Math.sin(Date.now() * 0.001)) * 0.5 + 0.5;
            ctx.globalAlpha = pulse;
            ctx.fillStyle = NET_COLOR;
            for (let i = 0; i <= canvas.height; i += 15) {
                ctx.fillRect(canvas.width / 2 - 1, i, 2, 10);
            }
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        }
        
        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx; p.y += p.dy; p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
        }

        function drawCursor() {
            if (currentScreen === 'playing' || currentScreen === 'paused') return;
            ctx.fillStyle = PLAYER_COLOR; ctx.shadowBlur = 5; ctx.shadowColor = PLAYER_COLOR;
            ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 5, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        // --- LOGIC FUNCTIONS ---
        function displayQuestion() {
            if (availableQuestions.length === 0) availableQuestions = [...allQuestions];
            const qIndex = Math.floor(Math.random() * availableQuestions.length);
            const questionData = availableQuestions[qIndex];
            lastQuestion = { question: questionData, index: qIndex, shuffledAnswers: [...questionData.answers].sort(() => Math.random() - 0.5) };
            currentScreen = 'question';
        }

        function checkAnswer(isCorrect) {
            let message = "";
            if (lastScorer === 'player') {
                if (isCorrect) { score.player += 2; message = `Correct! You get 2 points!`; } 
                else { score.player += 1; message = `Incorrect. You still get 1 point.`; }
            } else {
                if (isCorrect) { message = "Correct! You blocked the bonus point!"; } 
                else { score.cpu++; message = "Incorrect! CPU gets a bonus point!"; }
            }
            if(isCorrect) { 
                playSound(audio.sfx.correct, 'C5');
                availableQuestions.splice(lastQuestion.index, 1); 
            } else {
                playSound(audio.sfx.incorrect, 'F#3', '4n');
            }
            resetBall();
            
            showMessage(message, () => {
                setTimeout(() => {
                    if (score.player >= WINNING_SCORE || score.cpu >= WINNING_SCORE) { handleMatchEnd(); } 
                    else { gameActive = true; currentScreen = 'playing'; }
                }, 1000);
            });
        }
        
        function showMessage(msg, callback) {
            messageConfig = { text: msg, callback: callback };
            currentScreen = 'message';
        }

        function togglePause() {
            if (currentScreen !== 'playing' && currentScreen !== 'paused') return;
            gamePaused = !gamePaused;
            currentScreen = gamePaused ? 'paused' : 'playing';
            playSound(audio.sfx.click);

            if (gamePaused) {
                clearInterval(powerUpSpawner);
                powerUpIntervalTime = Math.max(0, 7000 - (Date.now() - lastPowerUpSpawnTime));
                for (const type in activeEffects) {
                    const effect = activeEffects[type];
                    clearTimeout(effect.timeoutId);
                    effect.remainingTime = powerUpTypes[type].duration - (Date.now() - effect.startTime);
                }
            } else {
                lastPowerUpSpawnTime = Date.now();
                powerUpSpawner = setTimeout(() => { spawnPowerUp(); clearInterval(powerUpSpawner); powerUpSpawner = setInterval(spawnPowerUp, 7000); }, powerUpIntervalTime);
                for (const type in activeEffects) {
                    const effect = activeEffects[type];
                    if (effect.remainingTime > 0) {
                        effect.startTime = Date.now();
                        effect.timeoutId = setTimeout(() => deactivatePowerUp(type), effect.remainingTime);
                    } else { deactivatePowerUp(type); }
                }
            }
        }
        
        function handleMatchEnd() {
            gameActive = false;
            if (powerUpSpawner) clearInterval(powerUpSpawner);
            if (score.player >= WINNING_SCORE) {
                const winBonus = 100 * pointMultiplier;
                totalScore += winBonus;
                const message = `Match Won! +${winBonus} Bonus! Prepare for the next round.`;
                showMessage(message, startNextMatch);
            } else {
                const finalMessage = `Game Over. Final Score: ${totalScore}. Play again?`;
                showMessage(finalMessage, init);
            }
        }

        function startNextMatch() {
            score = { player: 0, cpu: 0 };
            baseCpuLevel += DIFFICULTY_INCREASE_RATE;
            cpuLevel = baseCpuLevel;
            for (const type in activeEffects) { deactivatePowerUp(type); }
            activePowerUps = [];
            resetBall();
            gameActive = true;
            currentScreen = 'playing';
        }

        // --- UNMODIFIED OR MINIMALLY MODIFIED HELPERS ---
        function gameLoop() { 
            if (!gamePaused) update(); 
            render(); 
            animationFrameId = requestAnimationFrame(gameLoop); 
        }
        function isCollision(b, p) { return p.x < b.x + b.radius && p.x + p.width > b.x - b.radius && p.y < b.y + b.radius && p.y + p.height > b.y - b.radius; }
        function resetBall() { volleyCount = 0; ball.x = canvas.width / 2; ball.y = canvas.height / 2; ball.speed = activeEffects['speedBoost'] ? BASE_SPEED * 1.5 : BASE_SPEED; ball.dx = (lastScorer === 'player') ? -ball.speed : ball.speed; ball.dy = ball.speed * (Math.random() > 0.5 ? 1 : -1) * 0.7; cpuLevel += CPU_IMPROVEMENT_RATE; }
        
        function spawnPowerUp() { 
            if (gamePaused || activePowerUps.length >= 2 || currentScreen !== 'playing') return; 
            const type = Object.keys(powerUpTypes)[Math.floor(Math.random() * Object.keys(powerUpTypes).length)]; 
            activePowerUps.push({ x: Math.random() * (canvas.width * 0.6) + (canvas.width * 0.2), y: Math.random() * (canvas.height * 0.8) + (canvas.height * 0.1), size: POWERUP_SIZE, type: type }); 
            // FIX: Lowered pitch of powerup spawn sound from C6 to A4
            playSound(audio.sfx.powerupSpawn, 'A4', '16n'); 
        }

        function activatePowerUp(type, hitter) { if (activeEffects[type]) clearTimeout(activeEffects[type].timeoutId); const powerUpInfo = powerUpTypes[type]; playSound(audio.sfx.powerupGet, 'A5', '16n'); switch(type) { case 'speedBoost': ball.speed = BASE_SPEED * 1.5; break; case 'largePaddle': if(hitter === 'player') player.height = player.defaultHeight * 1.5; else cpu.height = cpu.defaultHeight * 1.5; break; case 'smallPaddle': player.height = player.defaultHeight * 0.5; cpu.height = cpu.defaultHeight * 0.5; break; case 'ghostBall': ball.alpha = 0.5; ball.pulseTime = 0; break; case 'slowDown': player.speedMultiplier = 0.3; cpu.speedMultiplier = 0.3; break; case 'invisiWall': invisiWall = { owner: hitter, x: (hitter === 'player' ? player.x + player.width + 5 : cpu.x - 15), y: 0, width: 10, height: canvas.height }; break; } activeEffects[type] = { startTime: Date.now(), timeoutId: setTimeout(() => deactivatePowerUp(type), powerUpInfo.duration), hitter: hitter }; }
        function deactivatePowerUp(type) { const hitter = activeEffects[type] ? activeEffects[type].hitter : null; switch(type) { case 'speedBoost': ball.speed = BASE_SPEED; break; case 'largePaddle': if(hitter === 'player') player.height = player.defaultHeight; else cpu.height = cpu.defaultHeight; break; case 'smallPaddle': player.height = player.defaultHeight; cpu.height = cpu.defaultHeight; break; case 'ghostBall': ball.alpha = 1; break; case 'slowDown': player.speedMultiplier = 1; cpu.speedMultiplier = 1; break; case 'invisiWall': invisiWall = null; break; } delete activeEffects[type]; }

        // --- EVENT LISTENERS ---
        async function handleInteractionStart(e) {
            // Initialize audio on the first user interaction to comply with browser autoplay policies
            if (!audioInitialized) {
                try {
                    await Tone.start();
                    initAudio();
                    console.log("Audio context started and initialized.");
                } catch (error) {
                    console.error("Could not start audio context:", error);
                }
            }

            const pos = getInteractionPos(e);
            if (e.type === 'touchstart') {
                touchStartY = pos.y;
                paddleStartY = player.y;
            }

            // Filter buttons based on current screen context
            const relevantButtons = uiButtons.filter(b => {
                if (b.isGameUI) return currentScreen === 'playing' || currentScreen === 'paused';
                return currentScreen !== 'playing' && currentScreen !== 'paused';
            });

            relevantButtons.forEach(button => {
                if (pos.x > button.x && pos.x < button.x + button.width && pos.y > button.y && pos.y < button.y + button.height) {
                    if(button.action) {
                        button.action();
                         // Play click sound for all buttons except the mute button (which handles its own sound)
                        if (button.id !== 'muteBtn' && audioInitialized) {
                            playSound(audio.sfx.click);
                        }
                    }
                }
            });
        }
        
        function handleInteractionMove(e) {
            e.preventDefault();
            const pos = getInteractionPos(e);
            mousePos.x = pos.x; mousePos.y = pos.y;
            let newTargetY;
            if (e.type === 'touchmove') {
                let deltaY = pos.y - touchStartY;
                newTargetY = paddleStartY + deltaY;
            } else {
                newTargetY = pos.y;
            }
            if (newTargetY < player.height / 2) newTargetY = player.height / 2;
            if (newTargetY > canvas.height - player.height / 2) newTargetY = canvas.height - player.height / 2;
            player.targetY = newTargetY - player.height / 2;
        }

        function getInteractionPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX; clientY = e.clientY;
            }
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }
        
        document.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); togglePause(); } });
        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener('mousedown', handleInteractionStart);
        canvas.addEventListener('mousemove', handleInteractionMove);
        canvas.addEventListener('touchstart', handleInteractionStart, { passive: false });
        canvas.addEventListener('touchmove', handleInteractionMove, { passive: false });

        // Initial Load
        window.onload = () => {
            ctx.font = "10px 'Press Start 2P'";
            setTimeout(() => {
                resizeCanvas();
                init();
            }, 100);
        };
    </script>
</body>
